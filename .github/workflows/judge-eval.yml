name: judge-eval
on:
  schedule:
    - cron: "15 4 * * 1"
  workflow_dispatch:
    inputs:
      planted_run:
        description: verify-wazig run id holding the planted bug evidence
        type: string
        default: '44536500173'
      planted_pr:
        description: pull request the planted run verified
        type: string
        default: '546'
      clean_run:
        description: verify-wazig run id holding the clean evidence
        type: string
        default: '44562234769'
      clean_pr:
        description: pull request the clean run verified
        type: string
        default: '551'
      families:
        description: comma separated judge families to test, or empty to pick two live families
        type: string
        default: ''
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: judge-eval-${{ github.ref }}
  cancel-in-progress: true
jobs:
  judge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Replay the saved evidence through each judge family
        env:
          VERDICT_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          PLANTED_RUN: ${{ inputs.planted_run || '44536500173' }}
          PLANTED_PR: ${{ inputs.planted_pr || '546' }}
          CLEAN_RUN: ${{ inputs.clean_run || '44562234769' }}
          CLEAN_PR: ${{ inputs.clean_pr || '551' }}
          FAMILIES: ${{ inputs.families }}
        run: |
          python3 tools/verify-wazig/judge_eval.py \
            --planted-run "$PLANTED_RUN" \
            --planted-pr "$PLANTED_PR" \
            --clean-run "$CLEAN_RUN" \
            --clean-pr "$CLEAN_PR" \
            --families "$FAMILIES" \
            --evidence-dir evidence
