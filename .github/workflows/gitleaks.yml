name: Gitleaks

on:
  pull_request:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || !github.event.deleted
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Pick the commits to scan
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = schedule ] || [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            echo "Scanning every branch, full history"
            echo "SCAN_ALL=1" >> "$GITHUB_ENV"
            exit 0
          fi
          if [ -n "$PR_BASE_SHA" ]; then
            base="$PR_BASE_SHA"; head="$PR_HEAD_SHA"
          else
            head="$PUSH_HEAD_SHA"
            base=$(git rev-parse "origin/$DEFAULT_BRANCH")
            [ "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH" ] && base=""
            if [ -n "$PUSH_BEFORE_SHA" ] && [ "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ] \
              && git cat-file -e "$PUSH_BEFORE_SHA^{commit}" 2>/dev/null; then
              base="$PUSH_BEFORE_SHA"
            fi
          fi
          echo "Scanning ${base:-the whole history}..$head"
          echo "SCAN_BASE=$base" >> "$GITHUB_ENV"
          echo "SCAN_HEAD=$head" >> "$GITHUB_ENV"
      - name: Run gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar -xz gitleaks
          if [ -n "$SCAN_ALL" ]; then
            ./gitleaks detect --no-banner --source . --redact --log-opts "--all"
          else
            ./gitleaks detect --no-banner --source . --redact --log-opts "${SCAN_BASE:+$SCAN_BASE..}$SCAN_HEAD"
          fi
      - name: Run trufflehog
        run: |
          curl -sSfL https://github.com/trufflesecurity/trufflehog/releases/download/v3.97.0/trufflehog_3.97.0_linux_amd64.tar.gz | tar -xz trufflehog
          set +e
          ./trufflehog git "file://$PWD" ${SCAN_HEAD:+--branch "$SCAN_HEAD"} ${SCAN_BASE:+--since-commit "$SCAN_BASE"} \
            --fail --no-update --json > found.json 2> trufflehog.err
          code=$?
          set -e
          jq -r '[.SourceMetadata.Data.Git.commit, .SourceMetadata.Data.Git.file, .DetectorName] | join(" ")' found.json | sort -u > hits.txt
          grep -o '"chunks":[0-9]*\|"bytes":[0-9]*\|"verified_secrets":[0-9]*\|"unverified_secrets":[0-9]*' trufflehog.err | tr '\n' ' ' || true
          rm -f found.json
          grep -vxFf .trufflehog-known.txt hits.txt > new-hits.txt || true
          cat new-hits.txt
          if [ "$code" = 183 ] && [ -s new-hits.txt ]; then
            echo "::error::trufflehog found a key. Remove it, and roll it if it was ever real."
            exit 1
          fi
          if [ "$code" != 0 ] && [ "$code" != 183 ]; then tail -5 trufflehog.err; exit "$code"; fi
