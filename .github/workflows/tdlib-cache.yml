name: tdlib-cache

on:
  push:
    branches: [main]
    paths:
      - tools/build-tdlib.sh
      - tools/TDLIB_COMMIT
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

jobs:
  cache:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: TDLib revision
        id: tdlib
        run: echo "commit=$(cat tools/TDLIB_COMMIT)" >> "$GITHUB_OUTPUT"
      - name: Restore TDLib
        id: tdcache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: /tmp/tdlib-install
          key: tdlib-${{ steps.tdlib.outputs.commit }}-${{ hashFiles('tools/build-tdlib.sh') }}
      - name: Install toolchain
        if: steps.tdcache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++-mingw-w64-x86-64 gperf php-cli cmake ninja-build
      - name: Build TDLib
        if: steps.tdcache.outputs.cache-hit != 'true'
        run: bash tools/build-tdlib.sh
