name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    timeout-minutes: 120
    env:
      TDLIB_COMMIT: d1085f9cebc5a62379991ae1652673954f229c1f
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.16.0
      - name: Check tag shape
        run: |
          echo "${GITHUB_REF_NAME}" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' \
            || { echo "tag ${GITHUB_REF_NAME} is not strict vX.Y.Z" >&2; exit 1; }
      - name: Install toolchain
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq g++-mingw-w64-x86-64 gperf php-cli cmake ninja-build
      - name: Restore TDLib
        id: tdcache
        if: false
        uses: actions/cache@v4
        with:
          path: /tmp/tdlib-install
          key: tdlib-${{ env.TDLIB_COMMIT }}-v2
      - name: Build TDLib
        if: false
        run: |
          P=/tmp/tdbuild-prefix
          mkdir -p "$P" /tmp/tdlib-install
          git clone https://github.com/madler/zlib.git /tmp/zlibsrc
          (cd /tmp/zlibsrc && git checkout 51b7f2abdade71cd9bb0e7a373ef2610ec6f9daf && CC=x86_64-w64-mingw32-gcc ./configure --static --prefix="$P" && make -j$(nproc) install)
          echo '2e8a40b01979afe8be0bbfb3de5dc1c6709fedb46d6c89c10da114ab5fc3d281  /tmp/openssl.tar.gz' > /tmp/openssl.sha256
          curl -fsSL --retry 3 --connect-timeout 30 --max-time 600 -o /tmp/openssl.tar.gz https://github.com/openssl/openssl/releases/download/openssl-3.3.2/openssl-3.3.2.tar.gz
          sha256sum -c /tmp/openssl.sha256
          mkdir -p /tmp/opensslsrc && tar -C /tmp/opensslsrc --strip-components=1 -xzf /tmp/openssl.tar.gz
          (cd /tmp/opensslsrc && ./Configure mingw64 no-asm no-shared no-tests no-docs --libdir=lib --prefix="$P" --cross-compile-prefix=x86_64-w64-mingw32- && make -j1 -s install_sw)
          cp -n "$P/lib64"/*.a "$P/lib/" 2>/dev/null || true
          git clone https://github.com/tdlib/td.git /tmp/tdsrc
          (cd /tmp/tdsrc && git checkout "$TDLIB_COMMIT")
          cmake -S /tmp/tdsrc -B /tmp/tdsrc/build-host -DCMAKE_BUILD_TYPE=Release -DTD_ENABLE_JNI=OFF
          cmake --build /tmp/tdsrc/build-host --target prepare_cross_compiling -j$(nproc)
          cmake -S /tmp/tdsrc -B /tmp/tdsrc/build -G Ninja \
            -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++ \
            -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc \
            -DCMAKE_BUILD_TYPE=Release \
            -DOPENSSL_ROOT_DIR="$P" \
            -DZLIB_INCLUDE_DIR="$P/include" \
            -DZLIB_LIBRARY="$P/lib/libz.a" \
            -DTD_ENABLE_JNI=OFF \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON
          cmake --build /tmp/tdsrc/build --target tdjson_static -j$(nproc)
          mkdir -p /tmp/tdlib-install/lib /tmp/tdlib-install/include/td
          find /tmp/tdsrc/build -name '*.a' -exec cp {} /tmp/tdlib-install/lib/ \;
          cp "$P"/lib/libcrypto.a "$P"/lib/libssl.a "$P"/lib/libz.a /tmp/tdlib-install/lib/
          for m in tdactor tdclient tdcore tdnet tdutils tddb tdmtproto tde2e; do cp -r /tmp/tdsrc/$m/td/. /tmp/tdlib-install/include/td/ 2>/dev/null || true; done
          cp -r /tmp/tdsrc/td/. /tmp/tdlib-install/include/td/
          cp -r /tmp/tdsrc/td/generate/auto/td/. /tmp/tdlib-install/include/td/
      - name: Build
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          args=(-Dtarget=x86_64-windows-gnu --release=small -Dversion="${GITHUB_REF_NAME#v}")
          if [ -n "$TELEGRAM_API_ID" ] && [ -n "$TELEGRAM_API_HASH" ]; then
            args+=(-Dtelegram-api-id="$TELEGRAM_API_ID" -Dtelegram-api-hash="$TELEGRAM_API_HASH")
          fi
          zig build "${args[@]}"
      - name: Package zip
        run: |
          cd zig-out/bin
          zip -r "${GITHUB_WORKSPACE}/Messages-${GITHUB_REF_NAME}.zip" Messages.exe wazigctl.exe *.ttf *LICENSE*
      - name: Build and package ARM64
        run: |
          zig build -Dtarget=aarch64-windows-gnu --release=small -Dversion="${GITHUB_REF_NAME#v}" -p zig-out-arm64
          cd zig-out-arm64/bin
          zip -r "${GITHUB_WORKSPACE}/Messages_arm64-${GITHUB_REF_NAME}.zip" Messages.exe wazigctl.exe *.ttf *LICENSE*
      - name: Package MSI
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq wixl wixl-data
          version="${GITHUB_REF_NAME#v}"
          echo "${version}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
          wixl -D "Version=${version}" -D "BinDir=${GITHUB_WORKSPACE}/zig-out/bin/" \
            -o "Messages-${GITHUB_REF_NAME}.msi" assets/installer.wxs
      - name: Checksums
        run: |
          sha256sum "Messages-${GITHUB_REF_NAME}.zip" "Messages_arm64-${GITHUB_REF_NAME}.zip" "Messages-${GITHUB_REF_NAME}.msi" > SHA256SUMS.txt
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: |
            Messages-*.zip
            Messages_arm64-*.zip
            Messages-*.msi
            SHA256SUMS.txt

  smoke:
    name: msi smoke test
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-bundle
      - name: Install silently
        shell: pwsh
        run: |
          $msi = (Get-ChildItem Messages-*.msi).FullName
          & msiexec /i $msi /qn /norestart /L*V install.log | Out-Null
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Get-Content install.log -Tail 40
            throw "msiexec install failed: $code"
          }
      - name: Verify install
        shell: pwsh
        run: |
          $exe = "$env:LOCALAPPDATA\Programs\Messages\Messages.exe"
          $lnk = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Messages.lnk"
          if (-not (Test-Path $exe)) { throw "missing $exe" }
          if (-not (Test-Path "$env:LOCALAPPDATA\Programs\Messages\IBMPlexSans-Regular.ttf")) { throw "missing bundled font" }
          if (-not (Test-Path $lnk)) { throw "missing Start menu shortcut $lnk" }
          $ctl = "$env:LOCALAPPDATA\Programs\Messages\wazigctl.exe"
          if (-not (Test-Path $ctl)) { throw "missing $ctl" }
          & $ctl --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "wazigctl --help failed: $LASTEXITCODE" }
          & $ctl status 2>$null | Out-Null
          if ($LASTEXITCODE -ne 3) { throw "wazigctl status without the app returned $LASTEXITCODE, expected 3" }
          exit 0
      - name: Headless Telegram smoke
        if: false
        shell: pwsh
        run: |
          $exe = "$env:LOCALAPPDATA\Programs\Messages\Messages.exe"
          $proc = Start-Process -FilePath $exe -ArgumentList '--tdlib-smoke' -Wait -PassThru
          $code = $proc.ExitCode
          if ($code -ne 0) { throw "tdlib smoke failed: $code" }
      - name: Uninstall silently
        shell: pwsh
        run: |
          $msi = (Get-ChildItem Messages-*.msi).FullName
          & msiexec /x $msi /qn /norestart | Out-Null
          $code = $LASTEXITCODE
          if ($code -ne 0) { throw "msiexec uninstall failed: $code" }
          if (Test-Path "$env:LOCALAPPDATA\Programs\Messages\Messages.exe") { throw "exe left behind after uninstall" }
          if (Test-Path "$env:LOCALAPPDATA\Programs\Messages\wazigctl.exe") { throw "wazigctl left behind after uninstall" }
          if (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Messages.lnk") { throw "shortcut left behind after uninstall" }

  release:
    name: release
    needs: [build, smoke]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-bundle
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" Messages-*.zip Messages_arm64-*.zip Messages-*.msi SHA256SUMS.txt --repo "${GITHUB_REPOSITORY}" --verify-tag --generate-notes \
            || gh release upload "${GITHUB_REF_NAME}" Messages-*.zip Messages_arm64-*.zip Messages-*.msi SHA256SUMS.txt --repo "${GITHUB_REPOSITORY}" --clobber
