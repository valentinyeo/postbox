name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  font-delivery:
    if: github.event_name == 'workflow_dispatch' && github.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: node tools/check-fonts.mjs
      - run: node --test tools/check-fonts.test.mjs
  build:
    name: build
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.16.0
      - name: Check tag shape
        run: |
          echo "${GITHUB_REF_NAME}" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' \
            || { echo "tag ${GITHUB_REF_NAME} is not strict vX.Y.Z" >&2; exit 1; }
      - name: Build
        run: zig build -Dtarget=x86_64-windows-gnu --release=small -Dversion="${GITHUB_REF_NAME#v}"
      - name: Package zip
        run: |
          cd zig-out/bin
          zip -r "${GITHUB_WORKSPACE}/Messages-${GITHUB_REF_NAME}.zip" Messages.exe wazigctl.exe postboxctl.exe IBMPlexSans-Regular.ttf IBMPlexSans-Medium.ttf IBMPlexSans-SemiBold.ttf IBMPlexSans-Bold.ttf IBMPlexSans-Italic.ttf IBMPlexMono-Regular.ttf *LICENSE*
      - name: Build and package ARM64
        run: |
          zig build -Dtarget=aarch64-windows-gnu --release=small -Dversion="${GITHUB_REF_NAME#v}" -p zig-out-arm64
          cd zig-out-arm64/bin
          zip -r "${GITHUB_WORKSPACE}/Messages_arm64-${GITHUB_REF_NAME}.zip" Messages.exe wazigctl.exe postboxctl.exe IBMPlexSans-Regular.ttf IBMPlexSans-Medium.ttf IBMPlexSans-SemiBold.ttf IBMPlexSans-Bold.ttf IBMPlexSans-Italic.ttf IBMPlexMono-Regular.ttf *LICENSE*
      - name: Branded archives with legacy updater aliases
        run: |
          cp "Messages-${GITHUB_REF_NAME}.zip" "Postbox-${GITHUB_REF_NAME}.zip"
          cp "Messages_arm64-${GITHUB_REF_NAME}.zip" "Postbox_arm64-${GITHUB_REF_NAME}.zip"
      - name: Package MSI
        run: |
          sudo -E apt-get -o DPkg::Lock::Timeout=120 -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo -E apt-get -o DPkg::Lock::Timeout=120 -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y wixl wixl-data
          version="${GITHUB_REF_NAME#v}"
          echo "${version}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
          wixl -D "Version=${version}" -D "BinDir=${GITHUB_WORKSPACE}/zig-out/bin/" \
            -o "Postbox-${GITHUB_REF_NAME}.msi" assets/installer.wxs
      - name: Checksums
        run: |
          sha256sum "Messages-${GITHUB_REF_NAME}.zip" "Messages_arm64-${GITHUB_REF_NAME}.zip" "Postbox-${GITHUB_REF_NAME}.msi" "Postbox-${GITHUB_REF_NAME}.zip" "Postbox_arm64-${GITHUB_REF_NAME}.zip" > SHA256SUMS.txt
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: |
            Messages-*.zip
            Messages_arm64-*.zip
            Postbox-*.msi
            Postbox-*.zip
            Postbox_arm64-*.zip
            SHA256SUMS.txt

  launch:
    name: Launch Windows app
    needs: build
    runs-on: windows-latest
    timeout-minutes: 4
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-bundle
      - name: Open the packaged app and check its main window
        shell: pwsh
        run: |
          Expand-Archive "Messages-${{ github.ref_name }}.zip" app
          $app = Start-Process "$PWD/app/Messages.exe" -WorkingDirectory "$PWD/app" -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(60)
            do {
              $app.Refresh()
              if ($app.HasExited) { throw "App exited before opening its window" }
              if ($app.MainWindowHandle -ne [IntPtr]::Zero) { exit 0 }
              Start-Sleep -Seconds 1
            } while ((Get-Date) -lt $deadline)
            throw 'App did not open a main window'
          } finally {
            if (-not $app.HasExited) { Stop-Process -Id $app.Id -Force }
          }

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan history for secrets
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --no-banner --source . --redact --log-opts "$GITHUB_SHA"

  release:
    name: release
    needs: [build, launch, gitleaks]
    permissions:
      contents: write
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compose product release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/update_cards.py release-notes --repo "$GITHUB_REPOSITORY" --tag "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.txt"
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-bundle
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" Messages-*.zip Messages_arm64-*.zip Postbox-*.zip Postbox_arm64-*.zip Postbox-*.msi SHA256SUMS.txt --repo "${GITHUB_REPOSITORY}" --verify-tag --notes-file "$RUNNER_TEMP/release-notes.txt" \
            || { gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --notes-file "$RUNNER_TEMP/release-notes.txt" && gh release upload "${GITHUB_REF_NAME}" Messages-*.zip Messages_arm64-*.zip Postbox-*.zip Postbox_arm64-*.zip Postbox-*.msi SHA256SUMS.txt --repo "${GITHUB_REPOSITORY}" --clobber; }
