name: verify-wazig
run-name: verify-wazig ${{ inputs.feature || 'pr' }} ${{ github.head_ref || github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      feature:
        description: User journey to drive
        type: string
        default: search
      tag:
        description: Published release to verify instead of building
        type: string
        default: ''
  push:
    branches: [ceo/igsh-1084, 'verify-release/v*']
  pull_request:
    paths:
      - .github/workflows/verify.yml
      - .claude/skills/verify-wazig/**
      - tools/verify-wazig/**
      - src/verify_text.json
      - src/font_config.zig
      - src/chat_list_layout.zig
      - src/text_draw.zig
      - src/main.zig
      - src/messenger_view.zig
      - src/theme.zig
      - src/archive_rules.zig
      - src/chat_rows.zig
      - src/chat_order.zig
      - src/slack_emoji.*
      - tools/generate-slack-emoji.py
      - tools/check_slack_emoji.py
      - tools/test_slack_emoji.py
      - src/slack.zig
      - src/hub*.zig
      - src/wa_hub*.zig
      - src/slack_win.zig
      - src/winhttp.zig
      - src/transport.zig
      - src/messenger_view.zig
      - src/chat_key.zig
      - src/chat_reconcile_test.zig
      - src/control.zig
      - src/outbox.zig
      - src/shortcuts.zig
      - src/directwrite_edit.zig
      - src/edit_contract.zig
      - src/text_draw.zig
      - src/win32.zig
      - build.zig
      - src/compose_layout.zig
      - src/paste_image.zig
      - src/paint_buffer.zig
      - src/smooth_shapes.zig

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}-${{ inputs.feature || 'search' }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Raw transcript provenance and historical summary export control
        run: python tools/check_transcript_copy_regression.py --zig zig
      - name: Plan registered journeys
        id: matrix
        shell: python
        env:
          EVENT_NAME: ${{ github.event_name }}
          FEATURE: ${{ inputs.feature || (github.event_name == 'push' && 'voice' || 'search') }}
        run: |
          import json
          import os
          from pathlib import Path

          journeys = json.loads(Path('tools/verify-wazig/journeys.json').read_text())['journeys']
          feature = os.environ['FEATURE']
          if os.environ['EVENT_NAME'] == 'pull_request':
              selected = [row for row in journeys if row['pr']]
          else:
              selected = [row for row in journeys if row['name'] == feature]
              if not selected:
                  raise SystemExit(f"Unknown verification journey: {feature}. See tools/verify-wazig/journeys.json")
          matrix = {'include': [{'feature': row['name'], 'evidence': row['evidence']} for row in selected]}
          value = json.dumps(matrix, separators=(',', ':'))
          print(value)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'matrix={value}\n')
  verify:
    needs: plan
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check skill map and PowerShell syntax
        shell: pwsh
        run: |
          python tools/verify-wazig/check-map.py
          if ($LASTEXITCODE -ne 0) { throw 'Invalid skill map' }
          foreach ($file in Get-ChildItem tools/verify-wazig/*.ps1) {
            $tokens = $null
            $errors = $null
            $null = [Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count) { throw ($errors | Out-String) }
          }
      - name: ISSUE-462 fixture text and native font metric parity with negative controls
        shell: pwsh
        run: node --test tools/verify-wazig/text-comparison.test.cjs
      - name: Install Chrome screenshot driver
        if: matrix.feature == 'text-comparison'
        shell: pwsh
        run: |
          npm install --prefix "$env:RUNNER_TEMP/text-compare" --no-save playwright-core@1.58.2
          if ($LASTEXITCODE -ne 0) { throw 'Chrome driver installation failed' }
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: ISSUE-462 row-sized DirectWrite regression
        shell: pwsh
        run: |
          & tools/verify-wazig/check-chat-rows.ps1
      - name: Original-source reply preview red control
        if: matrix.feature == 'reply' && inputs.tag == '' && !startsWith(github.ref_name, 'verify-release/')
        shell: pwsh
        run: |
          $source = Join-Path $env:RUNNER_TEMP 'reply-original-source'
          $prefix = Join-Path $env:GITHUB_WORKSPACE 'reply-original-bin'
          git worktree add --detach $source 570ac52
          if ($LASTEXITCODE -ne 0) { throw 'Original reply source unavailable' }
          Push-Location $source
          try {
            zig build '-Dtarget=x86_64-windows-gnu' --release=small '-Dversion=0.0.526' --prefix $prefix
            if ($LASTEXITCODE -ne 0) { throw 'Original reply build failed' }
          } finally { Pop-Location }
          pwsh -NoProfile -File tools/verify-wazig/run.ps1 -Feature reply -Bin reply-original-bin/bin -Evidence reply-red-evidence
          if ($LASTEXITCODE -eq 0) { throw 'Original source unexpectedly shows reply preview' }
          $failure = Get-Content reply-red-evidence/failure.txt -Raw
          if ($failure -notmatch 'Reply preview missing') { throw "Wrong reply red failure: $failure" }
          $originalLog = Get-Content reply-red-evidence/final-data/launch-log.txt -Raw
          if ($originalLog -notmatch 'Replying to Fixture Sender') { throw 'Original source did not select Reply' }
          New-Item verification-evidence -ItemType Directory -Force | Out-Null
          Copy-Item reply-red-evidence verification-evidence/red-control -Recurse
          'REPLY_ORIGINAL_RED_OK: Reply preview missing' | Set-Content verification-evidence/reply-red-control.txt
          exit 0
      - name: Sent ordering historical red control
        if: matrix.feature == 'slack-sort' && inputs.tag == '' && !startsWith(github.ref_name, 'verify-release/')
        shell: pwsh
        run: |
          $source = Join-Path $env:RUNNER_TEMP 'sent-order-original'
          $prefix = Join-Path $env:GITHUB_WORKSPACE 'sent-order-original-bin'
          git worktree add --detach $source 7dc3001
          if ($LASTEXITCODE -ne 0) { throw 'Original ordering source unavailable' }
          Push-Location $source
          try {
            zig build '-Dtarget=x86_64-windows-gnu' --release=small '-Dversion=0.0.526' --prefix $prefix
            if ($LASTEXITCODE -ne 0) { throw 'Original ordering build failed' }
          } finally { Pop-Location }
          pwsh -NoProfile -File tools/verify-wazig/run.ps1 -Feature slack-sort -Bin sent-order-original-bin/bin -Evidence verification-evidence/red-control
          if ($LASTEXITCODE -eq 0) { throw 'Original ordering unexpectedly passed stale WhatsApp sends' }
          $failure = Get-Content verification-evidence/red-control/failure.txt -Raw
          if ($failure -notmatch 'WhatsApp wa-sent last message order') { throw "Wrong ordering red failure: $failure" }
          New-Item verification-evidence -ItemType Directory -Force | Out-Null
          'SENT_ORDER_ORIGINAL_RED_OK: WhatsApp wa-sent last message order' | Set-Content verification-evidence/sent-order-red-control.txt
          exit 0
      - name: Build real desktop or download published release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || (startsWith(github.ref_name, 'verify-release/') && github.ref_name || '') }}
        run: |
          $env:RELEASE_TAG = $env:RELEASE_TAG -replace '^verify-release/', ''
          if ($env:RELEASE_TAG) {
            if ($env:RELEASE_TAG -notmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') { throw 'Invalid release tag' }
            gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --pattern "Postbox-$env:RELEASE_TAG.zip" --dir candidate
            if ($LASTEXITCODE -ne 0) { throw 'Published package download failed' }
            Expand-Archive "candidate/Postbox-$env:RELEASE_TAG.zip" zig-out/bin
            $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:RELEASE_TAG" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw 'Published package metadata unavailable' }
            $asset = @($release.assets | Where-Object name -CEQ "Postbox-$env:RELEASE_TAG.zip")
            if ($asset.Count -ne 1 -or $asset[0].digest -cne ('sha256:' + (Get-FileHash "candidate/Postbox-$env:RELEASE_TAG.zip").Hash.ToLowerInvariant())) { throw 'Published package digest mismatch' }
            New-Item verification-evidence -ItemType Directory -Force | Out-Null
            $release | ConvertTo-Json -Depth 20 | Set-Content verification-evidence/published-package.json
            (Get-FileHash zig-out/bin/Messages.exe).Hash | Set-Content verification-evidence/published-executable.sha256
            "VERIFY_VERSION=$($env:RELEASE_TAG.Substring(1))" >> $env:GITHUB_ENV
          } else {
            zig build '-Dtarget=x86_64-windows-gnu' --release=small '-Dversion=0.0.526'
            if ($LASTEXITCODE -ne 0) { throw 'Candidate build failed' }
            'VERIFY_VERSION=0.0.526' >> $env:GITHUB_ENV
          }
      - name: Native DirectWrite editing regression tests
        run: zig build test-edit '-Dtarget=x86_64-windows-gnu' --release=small
      - name: Build and capture the pre-change sidebar baseline
        if: matrix.feature == 'sidebar-surface'
        shell: pwsh
        run: |
          python tools/verify-wazig/test-sidebar-surface.py
          if ($LASTEXITCODE -ne 0) { throw 'Sidebar pixel oracle controls failed' }
          $candidate = (git rev-parse HEAD).Trim()
          $assertion = (git log --diff-filter=A --format=%H -- tools/verify-wazig/journey-sidebar-surface.ps1 | Select-Object -Last 1).Trim()
          $baseline = (git rev-parse "$assertion^1").Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Sidebar assertion parent missing' }
          $source = Join-Path $env:RUNNER_TEMP 'sidebar-baseline-source'
          $prefix = Join-Path $env:GITHUB_WORKSPACE 'sidebar-baseline-bin'
          git worktree add --detach $source $baseline
          if ($LASTEXITCODE -ne 0) { throw 'Sidebar baseline checkout failed' }
          Push-Location $source
          try {
            zig build '-Dtarget=x86_64-windows-gnu' --release=small '-Dversion=0.0.526' --prefix $prefix
            if ($LASTEXITCODE -ne 0) { throw 'Sidebar baseline build failed' }
          } finally { Pop-Location }
          New-Item verification-evidence -ItemType Directory -Force | Out-Null
          $env:GITHUB_SHA = $baseline
          try {
            & tools/verify-wazig/run.ps1 -Feature sidebar-surface -ExpectedProduct Wazig -Bin sidebar-baseline-bin/bin -Evidence verification-evidence/baseline
            if ($LASTEXITCODE -ne 0) { throw 'Sidebar baseline capture failed' }
          } finally { $env:GITHUB_SHA = $candidate }
          $fixtureText = [IO.File]::ReadAllText((Join-Path $env:GITHUB_WORKSPACE 'src/verify_text.json')).Replace("`r`n", "`n")
          $fixtureBytes = [Text.Encoding]::UTF8.GetBytes($fixtureText)
          $fixtureHash = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($fixtureBytes))
          @{
            candidate_commit = $candidate; baseline_commit = $baseline; assertion_commit = $assertion
            assertion_parent = (git rev-parse "$assertion^1").Trim()
            candidate_sha256 = (Get-FileHash zig-out/bin/Messages.exe).Hash
            baseline_sha256 = (Get-FileHash sidebar-baseline-bin/bin/Messages.exe).Hash
            fixture_sha256 = $fixtureHash
          } | ConvertTo-Json | Set-Content verification-evidence/sidebar-builds.json
      - name: IGSH-949 original-main red control for provider archive
        if: matrix.feature == 'hub-archive'
        shell: pwsh
        run: |
          $baseline = 'a956b59'
          $source = Join-Path $env:RUNNER_TEMP 'provider-archive-baseline'
          $prefix = Join-Path $env:GITHUB_WORKSPACE 'archive-baseline-bin'
          git worktree add --detach $source $baseline
          if ($LASTEXITCODE -ne 0) { throw 'Archive baseline checkout failed' }
          Push-Location $source
          try {
            zig build '-Dtarget=x86_64-windows-gnu' --release=small '-Dversion=0.0.526' --prefix $prefix
            if ($LASTEXITCODE -ne 0) { throw 'Archive baseline build failed' }
          } finally { Pop-Location }
          pwsh -NoProfile -File tools/verify-wazig/run.ps1 -Feature hub-archive -ExpectedProduct Wazig -Bin archive-baseline-bin/bin -Evidence archive-red-evidence
          if ($LASTEXITCODE -eq 0) { throw 'Original main unexpectedly passed provider archive' }
          $failure = Get-Content archive-red-evidence/failure.txt -Raw
          if ($failure -notmatch 'WhatsApp did not acknowledge archive') { throw "Wrong red control failure: $failure" }
          New-Item verification-evidence -ItemType Directory -Force | Out-Null
          Copy-Item archive-red-evidence verification-evidence/red-control -Recurse
          'IGSH-949 ORIGINAL MAIN RED VERIFIED: WhatsApp did not acknowledge archive' | Set-Content verification-evidence/red-control.txt
          exit 0
      - name: IGSH-1127 original-source notification red control
        if: matrix.feature == 'hub-archive'
        shell: pwsh
        run: |
          $baseline = 'a72caf4'
          $source = Join-Path $env:RUNNER_TEMP 'notification-baseline'
          $prefix = Join-Path $env:GITHUB_WORKSPACE 'notification-baseline-bin'
          git worktree add --detach $source $baseline
          if ($LASTEXITCODE -ne 0) { throw 'Notification baseline checkout failed' }
          Push-Location $source
          try {
            zig build '-Dtarget=x86_64-windows-gnu' --release=small '-Dversion=0.0.526' --prefix $prefix
            if ($LASTEXITCODE -ne 0) { throw 'Notification baseline build failed' }
          } finally { Pop-Location }
          pwsh -NoProfile -File tools/verify-wazig/run.ps1 -Feature hub-archive -Bin notification-baseline-bin/bin -Evidence notification-red-evidence
          if ($LASTEXITCODE -eq 0) { throw 'Original source unexpectedly notified' }
          Copy-Item notification-red-evidence verification-evidence/notification-red-control -Recurse
          $failure = Get-Content notification-red-evidence/failure.txt -Raw
          if ($failure -notmatch 'incoming archived desktop notification') { throw "Wrong notification red failure: $failure" }
          'IGSH-1127 ORIGINAL SOURCE RED VERIFIED: incoming archived desktop notification' | Set-Content verification-evidence/notification-red-control.txt
          exit 0
      - name: IGSH-1120 original renderer rejects visible source marks
        if: matrix.feature == 'appearance'
        shell: pwsh
        run: |
          $baseline = '2653484'
          $source = Join-Path $env:RUNNER_TEMP 'chat-design-baseline'
          $prefix = Join-Path $env:GITHUB_WORKSPACE 'chat-design-baseline-bin'
          git worktree add --detach $source $baseline
          if ($LASTEXITCODE -ne 0) { throw 'Chat design baseline checkout failed' }
          Push-Location $source
          try {
            zig build '-Dtarget=x86_64-windows-gnu' --release=small '-Dversion=0.0.526' --prefix $prefix
            if ($LASTEXITCODE -ne 0) { throw 'Chat design baseline build failed' }
          } finally { Pop-Location }
          pwsh -NoProfile -File tools/verify-wazig/run.ps1 -Feature appearance -Bin chat-design-baseline-bin/bin -Evidence chat-design-red-evidence
          if ($LASTEXITCODE -eq 0) { throw 'Original renderer unexpectedly passed chat formatting' }
          $failure = Get-Content chat-design-red-evidence/failure.txt -Raw
          if ($failure -notmatch 'Visible markup: bold stars still painted') { throw "Wrong chat design red failure: $failure" }
          New-Item verification-evidence -ItemType Directory -Force | Out-Null
          Copy-Item chat-design-red-evidence verification-evidence/chat-design-red-control -Recurse
          'IGSH-1120 ORIGINAL RENDERER RED VERIFIED: visible bold stars' | Set-Content verification-evidence/chat-design-red-control.txt
          exit 0
      - name: Real playback rejects the original missing output device
        if: matrix.feature == 'voice' && inputs.tag == '' && !startsWith(github.ref_name, 'verify-release/')
        shell: pwsh
        run: |
          Stop-Service Audiosrv -Force -ErrorAction SilentlyContinue
          pwsh -NoProfile -File tools/verify-wazig/run.ps1 -Feature voice -Bin zig-out/bin -Evidence verification-evidence/no-output -ExpectedVersion $env:VERIFY_VERSION
          if ($LASTEXITCODE -eq 0) { throw 'Missing audio output unexpectedly played' }
          $failure = Get-Content verification-evidence/no-output/failure.txt -Raw
          if ($failure -notmatch 'voice: downloaded playback position advances') { throw "Wrong audio negative control failure: $failure" }
          'VOICE_NO_OUTPUT_RED_OK' | Set-Content verification-evidence/audio-red-control.txt
          exit 0
      - name: Install isolated signed audio output
        if: matrix.feature == 'voice'
        shell: pwsh
        run: tools/verify-wazig/install-audio.ps1
      - name: Real playback rejects the original invalid voice fixture
        if: matrix.feature == 'voice' && inputs.tag == '' && !startsWith(github.ref_name, 'verify-release/')
        shell: pwsh
        run: |
          $fixture = 'tools/verify-wazig/voice-note.ogg'
          $valid = [IO.File]::ReadAllBytes($fixture)
          try {
            $old = [byte[]]([Text.Encoding]::ASCII.GetBytes('OggS') + (@(0..255) * 8))
            [IO.File]::WriteAllBytes($fixture, $old)
            pwsh -NoProfile -File tools/verify-wazig/run.ps1 -Feature voice -Bin zig-out/bin -Evidence verification-evidence/invalid-opus -ExpectedVersion $env:VERIFY_VERSION
            if ($LASTEXITCODE -eq 0) { throw 'Original invalid voice fixture unexpectedly played' }
            $failure = Get-Content verification-evidence/invalid-opus/failure.txt -Raw
            if ($failure -notmatch 'voice: downloaded playback position advances') { throw "Wrong invalid Opus failure: $failure" }
          } finally { [IO.File]::WriteAllBytes($fixture, $valid) }
          'VOICE_INVALID_OPUS_RED_OK' | Set-Content verification-evidence/invalid-opus-red-control.txt
          exit 0
      - name: Launch, doctor and drive
        shell: pwsh
        run: pwsh -NoProfile -File tools/verify-wazig/run.ps1 -Feature '${{ matrix.feature }}' -Bin zig-out/bin -Evidence verification-evidence -ExpectedVersion $env:VERIFY_VERSION
      - name: Validate surviving journey evidence
        if: matrix.evidence
        shell: pwsh
        run: |
          python tools/verify-wazig/check-evidence.py verification-evidence
          if ($LASTEXITCODE -ne 0) { throw 'Invalid journey evidence' }
      - name: Archive rows through the production renderer with a light fixture palette
        if: matrix.feature == 'show-archived'
        shell: pwsh
        run: pwsh -NoProfile -File tools/verify-wazig/verify-archive-light.ps1
      - name: Verify offline palette and unconfigured backend after unified search
        if: matrix.feature == 'search'
        shell: pwsh
        run: |
          pwsh -NoProfile -File tools/verify-wazig/run.ps1 -Feature palette -Bin zig-out/bin -Evidence verification-evidence/palette
          if ($LASTEXITCODE -ne 0) { throw 'Palette journey failed' }
          python tools/verify-wazig/check-evidence.py verification-evidence/palette
          if ($LASTEXITCODE -ne 0) { throw 'Invalid palette evidence' }
      - name: ISSUE-462 validate text comparison artifact
        if: matrix.feature == 'text-comparison'
        shell: pwsh
        run: |
          node tools/verify-wazig/check-text-comparison.cjs verification-evidence
          if ($LASTEXITCODE -ne 0) { throw 'Invalid comparison evidence' }
      - name: Cleanup even after a failed journey
        if: always()
        shell: pwsh
        run: pwsh -NoProfile -File tools/verify-wazig/cleanup.ps1 -Evidence verification-evidence
      - name: Validate menus evidence
        if: success() && matrix.feature == 'menus'
        shell: pwsh
        run: |
          python tools/verify-wazig/check-evidence.py verification-evidence
          if ($LASTEXITCODE -ne 0) { throw 'Invalid menus evidence' }
      - name: Validate archive evidence
        if: ${{ success() && inputs.feature == 'archive' }}
        run: python tools/verify-wazig/check-evidence.py verification-evidence
      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-wazig-${{ matrix.feature }}
          path: verification-evidence/
          if-no-files-found: error
