  pull-requests: read
  actions: read
  id-token: write
jobs:
  verify-gate:
    uses: valentinyeo/house-rules/.github/workflows/verify-gate.yml@314afbe2aea6a2083cc931f49aabd7ad0edcf45b
    with:
      pr-number: ${{ github.event.pull_request.number }}
