name: verify-wazig
run-name: verify-wazig ${{ inputs.feature || 'pr' }} ${{ github.head_ref || github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      feature:
        description: User journey to drive
        type: choice
        default: search
        options: [search, navigation, drafts, palette, appearance, menus, reactions, whatsapp-hub, hub, hub-archive, slack-sort, slack-archive, slack-threads, views, workspace-icons, signal, telegram, notrap, repaint, archive, text-comparison, window]
  pull_request:
    paths:
      - .github/workflows/verify.yml
      - .claude/skills/verify-wazig/**
      - tools/verify-wazig/**
      - src/verify_text.json
      - src/font_config.zig
      - src/text_draw.zig
      - src/main.zig
      - src/archive_rules.zig
      - src/chat_rows.zig
      - src/chat_order.zig
      - src/slack.zig
      - src/hub*.zig
      - src/wa_hub*.zig
      - src/slack_win.zig
      - src/transport.zig
      - src/messenger_view.zig
      - src/chat_key.zig
      - src/chat_reconcile_test.zig
      - src/control.zig
      - src/outbox.zig
      - src/shortcuts.zig
      - src/directwrite_edit.zig
      - src/edit_contract.zig
      - src/text_draw.zig
      - src/win32.zig
      - build.zig
      - src/compose_layout.zig

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}-${{ inputs.feature || 'search' }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        feature: ${{ fromJSON(github.event_name == 'pull_request' && '["reactions","menus","search","drafts","whatsapp-hub","hub","hub-archive","slack-sort","slack-archive","slack-threads","views","workspace-icons","signal","telegram","notrap","text-comparison","repaint","window"]' || format('["{0}"]', inputs.feature || 'search')) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check skill map and PowerShell syntax
        shell: pwsh
        run: |
          python tools/verify-wazig/check-map.py
          if ($LASTEXITCODE -ne 0) { throw 'Invalid skill map' }
          foreach ($file in Get-ChildItem tools/verify-wazig/*.ps1) {
            $tokens = $null
            $errors = $null
            $null = [Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count) { throw ($errors | Out-String) }
          }
      - name: ISSUE-462 fixture text and native font metric parity with negative controls
        shell: pwsh
        run: node --test tools/verify-wazig/text-comparison.test.cjs
      - name: Install Chrome screenshot driver
        if: matrix.feature == 'text-comparison'
        shell: pwsh
        run: |
          npm install --prefix "$env:RUNNER_TEMP/text-compare" --no-save playwright-core@1.58.2
          if ($LASTEXITCODE -ne 0) { throw 'Chrome driver installation failed' }
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: ISSUE-462 row-sized DirectWrite regression
        shell: pwsh
        run: |
          & tools/verify-wazig/check-chat-rows.ps1
      - name: Build real desktop and control client
        run: zig build '-Dtarget=x86_64-windows-gnu' --release=small '-Dversion=0.0.526'
      - name: Native DirectWrite editing regression tests
        run: zig build test-edit '-Dtarget=x86_64-windows-gnu' --release=small
      - name: Launch, doctor and drive
        shell: pwsh
        run: pwsh -NoProfile -File tools/verify-wazig/run.ps1 -Feature '${{ matrix.feature }}' -Bin zig-out/bin -Evidence verification-evidence
      - name: Validate surviving journey evidence
        if: matrix.feature == 'repaint' || matrix.feature == 'reactions' || matrix.feature == 'search' || matrix.feature == 'whatsapp-hub' || matrix.feature == 'hub' || matrix.feature == 'hub-archive' || matrix.feature == 'slack-sort' || matrix.feature == 'slack-archive' || matrix.feature == 'slack-threads' || matrix.feature == 'views' || matrix.feature == 'workspace-icons' || matrix.feature == 'signal' || matrix.feature == 'telegram' || matrix.feature == 'notrap' || matrix.feature == 'palette' || matrix.feature == 'appearance' || matrix.feature == 'window'
        shell: pwsh
        run: |
          python tools/verify-wazig/check-evidence.py verification-evidence
          if ($LASTEXITCODE -ne 0) { throw 'Invalid journey evidence' }
      - name: Validate search pill ink centering
        if: matrix.feature == 'search'
        shell: pwsh
        run: |
          python tools/verify-wazig/check-search-center.py verification-evidence
          if ($LASTEXITCODE -ne 0) { throw 'Search text is not centered' }
      - name: ISSUE-462 validate text comparison artifact
        if: matrix.feature == 'text-comparison'
        shell: pwsh
        run: |
          node tools/verify-wazig/check-text-comparison.cjs verification-evidence
          if ($LASTEXITCODE -ne 0) { throw 'Invalid comparison evidence' }
      - name: Cleanup even after a failed journey
        if: always()
        shell: pwsh
        run: pwsh -NoProfile -File tools/verify-wazig/cleanup.ps1 -Evidence verification-evidence
      - name: Validate menus evidence
        if: success() && matrix.feature == 'menus'
        shell: pwsh
        run: |
          python tools/verify-wazig/check-evidence.py verification-evidence
          if ($LASTEXITCODE -ne 0) { throw 'Invalid menus evidence' }
      - name: Validate archive evidence
        if: ${{ success() && inputs.feature == 'archive' }}
        run: python tools/verify-wazig/check-evidence.py verification-evidence
      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-wazig-${{ matrix.feature }}
          path: verification-evidence/
          if-no-files-found: error
