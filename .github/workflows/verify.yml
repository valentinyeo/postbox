name: verify-wazig
run-name: verify-wazig ${{ inputs.feature || 'pr' }} ${{ github.head_ref || github.ref_name }}

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
    inputs:
      feature:
        description: User journey to drive
        type: string
        default: search
      repeat:
        description: Number of independent journey runs (1 to 3)
        type: string
        default: '1'
      tag:
        description: Published release to verify instead of building
        type: string
        default: ''
  schedule:
    - cron: "40 2 * * *"

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.feature || 'search' }}
  cancel-in-progress: true

env:
  BASE_ZIG_VERSION: '0.16.0'
  BASE_APP_VERSION: '0.0.526'

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      repro: ${{ steps.matrix.outputs.repro }}
      needed: ${{ steps.matrix.outputs.needed }}
      notes: ${{ steps.matrix.outputs.notes }}
      planted: ${{ steps.planted.outputs.planted }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.BASE_ZIG_VERSION }}
      - name: Raw transcript provenance and historical summary export control
        run: python tools/check_transcript_copy_regression.py --zig zig
      - name: Unified snapshot and checkpoint proofs
        run: |
          zig test src/unified_snapshot.zig
          python tools/test_unified_snapshot_atomic.py --zig zig
          python tools/test_unified_checkpoint.py --zig zig --negative-controls
      - name: Plan registered journeys
        id: matrix
        shell: python
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          FEATURE: ${{ inputs.feature || (github.event_name == 'push' && 'voice' || 'search') }}
        run: |
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys

          sys.path.insert(0, 'tools/verify-wazig')
          from plan_journeys import plan_journeys

          journeys = json.loads(Path('tools/verify-wazig/journeys.json').read_text())['journeys']
          feature = os.environ['FEATURE']
          if os.environ['EVENT_NAME'] == 'schedule' or feature == 'all':
              selected = journeys
          elif os.environ['EVENT_NAME'] == 'pull_request':
              mapping = json.loads(Path('tools/verify-wazig/pr-journeys.json').read_text())
              files = subprocess.check_output(['git', 'diff', '--name-only', '--no-renames', '-z', os.environ['BASE_SHA'], 'HEAD']).decode().split('\0')
              event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())['pull_request']
              body = Path(os.environ['RUNNER_TEMP']) / 'pr-body.txt'
              changed = Path(os.environ['RUNNER_TEMP']) / 'pr-files.txt'
              body.write_text(event.get('body') or '')
              changed.write_text('\n'.join(files))
              validation = subprocess.run(['bash', 'tools/check-repro-first.sh', event['title'], str(body), str(changed)], text=True, capture_output=True)
              repro = validation.stdout.strip() if validation.returncode == 0 else ''
              notes = [] if repro and repro != 'none' else ['No repro journey selected.']
              needed = bool(repro and repro != 'none') or any(p.startswith(('src/', 'tools/verify-wazig/')) or p in ('build.zig', '.github/workflows/verify.yml') for p in files)
              with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
                  output.write('notes=' + json.dumps(notes) + '\n')
                  output.write(f'repro={repro if repro != "none" else ""}\nneeded={str(needed).lower()}\n')
              try:
                  names = plan_journeys(files, mapping, journeys, repro)
              except ValueError as error:
                  raise SystemExit(str(error))
              selected = [row for row in journeys if row['name'] in names]
          else:
              selected = [row for row in journeys if row['name'] == feature]
              if not selected:
                  raise SystemExit(f"Unknown verification journey: {feature}. See tools/verify-wazig/journeys.json")
          matrix = {'include': [{'feature': row['name'], 'evidence': row['evidence']} for row in selected]}
          value = json.dumps(matrix, separators=(',', ':'))
          print(value)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'matrix={value}\n')
      - name: Plan planted journeys
        id: planted
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          patches = sorted(p.stem for p in Path('tools/verify-wazig/planted').glob('*.patch'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('planted=' + json.dumps({'feature': patches}, separators=(',', ':')) + '\n')
  base-fails:
    name: base-fails (${{ needs.plan.outputs.repro }})
    needs: [plan]
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: windows-latest
    timeout-minutes: 20
    outputs:
      classified: ${{ steps.classification.outputs.classified }}
    steps:
      - uses: actions/checkout@v4
        if: needs.plan.outputs.repro != ''
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - uses: actions/checkout@v4
        if: needs.plan.outputs.repro != ''
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr-head
      - name: Resolve registered repro script
        id: journey
        if: needs.plan.outputs.repro != ''
        shell: python
        env:
          FEATURE: ${{ needs.plan.outputs.repro }}
        run: |
          import json
          import os
          from pathlib import Path
          journeys = json.loads(Path('pr-head/tools/verify-wazig/journeys.json').read_text())['journeys']
          script = next(row['script'] for row in journeys if row['name'] == os.environ['FEATURE'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'script={script}\n')
      - name: Cache base reproduction classification
        id: base-cache
        if: needs.plan.outputs.repro != ''
        uses: actions/cache@v4
        with:
          path: base-evidence/classification.json
          key: repro-base-v1-${{ github.event.pull_request.base.sha }}-${{ needs.plan.outputs.repro }}-${{ hashFiles(format('pr-head/tools/verify-wazig/{0}', steps.journey.outputs.script)) }}-${{ hashFiles('pr-head/tools/verify-wazig/**') }}-${{ env.BASE_ZIG_VERSION }}-${{ env.BASE_APP_VERSION }}
      - uses: mlugg/setup-zig@v2
        if: needs.plan.outputs.repro != '' && steps.base-cache.outputs.cache-hit != 'true'
        with:
          version: ${{ env.BASE_ZIG_VERSION }}
          use-cache: false
      - name: Build base desktop
        if: needs.plan.outputs.repro != '' && steps.base-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          zig build '-Dtarget=x86_64-windows-gnu' --release=small '-Dversion=${{ env.BASE_APP_VERSION }}'
          if ($LASTEXITCODE -ne 0) { throw 'Base build failed' }
      - name: Overlay PR journey tools
        if: needs.plan.outputs.repro != '' && steps.base-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Remove-Item tools/verify-wazig -Recurse -Force
          Copy-Item pr-head/tools/verify-wazig tools/verify-wazig -Recurse
      - name: Install audio output
        if: steps.base-cache.outputs.cache-hit != 'true' && (needs.plan.outputs.repro == 'voice')
        shell: pwsh
        run: tools/verify-wazig/install-audio.ps1
      - name: Install typing recorder
        if: steps.base-cache.outputs.cache-hit != 'true' && (needs.plan.outputs.repro == 'drafts' || needs.plan.outputs.repro == 'media-fit')
        shell: pwsh
        run: tools/verify-wazig/install-ffmpeg.ps1
      - name: Build historical rollback input
        if: steps.base-cache.outputs.cache-hit != 'true' && (needs.plan.outputs.repro == 'hub-rollback' || needs.plan.outputs.repro == 'hub-migration-crash' || needs.plan.outputs.repro == 'hub-migration-before-rename')
        shell: pwsh
        run: |
          & tools/verify-wazig/build-historical-847.ps1 -Evidence verification-evidence/historical-847
          if ($LASTEXITCODE -ne 0) { throw 'Historical rollback build failed' }
      - name: Install Chrome screenshot driver
        if: steps.base-cache.outputs.cache-hit != 'true' && (needs.plan.outputs.repro == 'text-comparison')
        shell: pwsh
        run: |
          npm install --prefix "$env:RUNNER_TEMP/text-compare" --no-save playwright-core@1.58.2
          if ($LASTEXITCODE -ne 0) { throw 'Chrome driver installation failed' }
      - name: Run reproduction on base
        id: repro
        if: needs.plan.outputs.repro != '' && steps.base-cache.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          FEATURE: ${{ needs.plan.outputs.repro }}
          GITHUB_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          pwsh -NoProfile -File tools/verify-wazig/run.ps1 -Feature $env:FEATURE -Bin zig-out/bin -Evidence base-evidence -ExpectedVersion ${{ env.BASE_APP_VERSION }}
          $code = $LASTEXITCODE
          & tools/verify-wazig/classify-red.ps1 -Feature $env:FEATURE -Evidence base-evidence -ExitCode $code -ResultFile base-evidence/classification.json
          exit 0
      - name: Read base classification
        id: classification
        if: needs.plan.outputs.repro != ''
        shell: pwsh
        env:
          FEATURE: ${{ needs.plan.outputs.repro }}
        run: |
          $result = Get-Content base-evidence/classification.json -Raw | ConvertFrom-Json
          if ($result.feature -cne $env:FEATURE -or $result.classification -cne 'reproduced' -or -not $result.check.StartsWith("$($env:FEATURE): ")) { throw 'Invalid cached base classification' }
          'classified=true' >> $env:GITHUB_OUTPUT
      - name: Summarize base cache
        if: always()
        shell: pwsh
        env:
          FEATURE: ${{ needs.plan.outputs.repro }}
          CACHE_HIT: ${{ steps.base-cache.outputs.cache-hit }}
        run: |
          $status = if (-not $env:FEATURE) { 'not used (no repro)' } elseif ($env:CACHE_HIT -eq 'true') { 'hit' } else { 'miss' }
          "Base repro cache: $status" >> $env:GITHUB_STEP_SUMMARY
      - name: Upload base evidence
        if: ${{ always() && needs.plan.outputs.repro != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: repro-base
          path: base-evidence/
          if-no-files-found: warn
  planted:
    name: planted (${{ matrix.feature }})
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    needs: [plan]
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.planted) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.BASE_ZIG_VERSION }}
          use-cache: false
      - name: Apply planted bug
        shell: pwsh
        env:
          FEATURE: ${{ matrix.feature }}
        run: |
          git apply --ignore-whitespace "tools/verify-wazig/planted/$env:FEATURE.patch"
          if ($LASTEXITCODE -ne 0) { throw 'Patch failed to apply' }
      - name: Build planted desktop
        shell: pwsh
        run: |
          zig build '-Dtarget=x86_64-windows-gnu' --release=small '-Dversion=${{ env.BASE_APP_VERSION }}'
          if ($LASTEXITCODE -ne 0) { throw 'Planted build failed' }
      - name: Install audio output
        if: matrix.feature == 'voice'
        shell: pwsh
        run: tools/verify-wazig/install-audio.ps1
      - name: Install typing recorder
        if: matrix.feature == 'drafts' || matrix.feature == 'media-fit'
        shell: pwsh
        run: tools/verify-wazig/install-ffmpeg.ps1
      - name: Build pinned historical rollback input
        if: matrix.feature == 'hub-rollback' || matrix.feature == 'hub-migration-crash' || matrix.feature == 'hub-migration-before-rename'
        shell: pwsh
        run: |
          & tools/verify-wazig/build-historical-847.ps1 -Evidence planted-evidence/historical-847
          if ($LASTEXITCODE -ne 0) { throw 'Historical rollback build failed' }
      - name: Run planted journey
        id: journey
        continue-on-error: true
        shell: pwsh
        env:
          FEATURE: ${{ matrix.feature }}
        run: |
          pwsh -NoProfile -File tools/verify-wazig/run.ps1 -Feature $env:FEATURE -Bin zig-out/bin -Evidence planted-evidence -ExpectedVersion ${{ env.BASE_APP_VERSION }}
          "code=$LASTEXITCODE" >> $env:GITHUB_OUTPUT
      - name: Classify planted failure
        id: classify
        shell: pwsh
        env:
          FEATURE: ${{ matrix.feature }}
          CODE: ${{ steps.journey.outputs.code }}
        run: |
          if ($env:CODE -notmatch '^\d+$') { throw 'Journey did not report an exit code' }
          & tools/verify-wazig/classify-red.ps1 -Feature $env:FEATURE -Evidence planted-evidence -ExitCode ([int]$env:CODE) -PassedMessage 'planted bug not caught'
          exit 0
      - name: Record planted result
        if: always()
        shell: pwsh
        env:
          CLASSIFICATION: ${{ steps.classify.outcome }}
          CODE: ${{ steps.journey.outputs.code }}
        run: |
          New-Item planted-result -ItemType Directory -Force | Out-Null
          $result = if ($env:CLASSIFICATION -eq 'success') { 'FAIL as expected' } elseif ($env:CODE -eq '0') { 'NOT CAUGHT' } else { 'BUILD ERROR' }
          $result | Set-Content planted-result/result.txt
      - name: Upload planted result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: planted-result-${{ matrix.feature }}
          path: planted-result/
      - name: Upload planted evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: planted-evidence-${{ matrix.feature }}
          path: planted-evidence/
          if-no-files-found: warn
  planted-summary:
    if: ${{ always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && needs.plan.result == 'success' }}
    needs: [plan, planted, verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: planted-result-*
          path: results
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with:
          pattern: verify-wazig-*
          path: results
        continue-on-error: true
      - name: Summarize planted and clean journeys
        shell: python
        env:
          MATRIX: ${{ needs.plan.outputs.planted }}
        run: |
          import json
          import os
          from pathlib import Path

          root = Path('results')
          lines = ['| Journey | Planted result | Clean result |', '|---|---|---|']
          for name in json.loads(os.environ['MATRIX'])['feature']:
              result = root / f'planted-result-{name}' / 'result.txt'
              planted = result.read_text(encoding='utf-8-sig').strip() if result.exists() else 'BUILD ERROR'
              clean_file = root / f'verify-wazig-{name}' / 'clean-result.txt'
              clean = clean_file.read_text(encoding='utf-8-sig').strip().upper() if clean_file.exists() else 'NOT RUN OR NO EVIDENCE'
              lines.append(f'| {name} | {planted} | {clean} |')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('\n'.join(lines) + '\n')
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [plan]
    if: ${{ (github.event_name != 'pull_request' || needs.plan.outputs.needed == 'true') && inputs.tag == '' && !startsWith(github.ref_name, 'verify-release/') }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.BASE_ZIG_VERSION }}
      - name: Build the candidate Windows desktop once
        run: zig build -Dtarget=x86_64-windows-gnu --release=small -Dversion=${{ env.BASE_APP_VERSION }}
      - name: Upload the candidate Windows desktop
        uses: actions/upload-artifact@v4
        with:
          name: Postbox-candidate
          path: zig-out/bin/
  native-tests:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.BASE_ZIG_VERSION }}
          use-cache: false
      - name: Journey failure marker negative controls
        shell: pwsh
        run: |
          python -m pip install PyYAML
          if ($LASTEXITCODE -ne 0) { throw 'Journey test dependencies failed' }
          python -m unittest discover -s tools -p test_verify_failure_marker.py
          if ($LASTEXITCODE -ne 0) { throw 'Journey failure marker controls failed' }
      - name: Native DirectWrite editing regression tests
        run: zig build test-edit '-Dtarget=x86_64-windows-gnu' --release=small
  verify:
    needs: [plan, candidate]
    if: ${{ !cancelled() && needs.plan.result == 'success' && (github.event_name != 'pull_request' || needs.plan.outputs.needed == 'true') && needs.candidate.result != 'failure' }}
    runs-on: windows-latest
    timeout-minutes: ${{ github.event_name == 'pull_request' && 20 || 60 }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check skill map and PowerShell syntax
        shell: pwsh
        run: |
          python tools/verify-wazig/check-map.py
          if ($LASTEXITCODE -ne 0) { throw 'Invalid skill map' }
          foreach ($file in Get-ChildItem tools/verify-wazig/*.ps1) {
            $tokens = $null
            $errors = $null
            $null = [Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count) { throw ($errors | Out-String) }
          }
      - name: ISSUE-462 fixture text and native font metric parity with negative controls
        shell: pwsh
        run: node --test tools/verify-wazig/text-comparison.test.cjs
      - name: Install Chrome screenshot driver
        if: matrix.feature == 'text-comparison'
        shell: pwsh
        run: |
          npm install --prefix "$env:RUNNER_TEMP/text-compare" --no-save playwright-core@1.58.2
          if ($LASTEXITCODE -ne 0) { throw 'Chrome driver installation failed' }
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.BASE_ZIG_VERSION }}
          use-cache: false
      - name: Build pinned historical rollback input
        if: matrix.feature == 'hub-rollback' || matrix.feature == 'hub-migration-crash' || matrix.feature == 'hub-migration-before-rename'
        shell: pwsh
        run: |
          & tools/verify-wazig/build-historical-847.ps1 -Evidence verification-evidence/historical-847
          if ($LASTEXITCODE -ne 0) { throw 'Historical rollback build failed' }
      - name: Unified private Windows path operations
        if: matrix.feature == 'hub' || matrix.feature == 'whatsapp-hub'
        shell: pwsh
        run: |
          python tools/test_unified_windows_paths.py --zig zig
          if ($LASTEXITCODE -ne 0) { throw 'Unified private path operations failed' }
      - name: ISSUE-462 row-sized DirectWrite regression
        shell: pwsh
        run: |
          & tools/verify-wazig/check-chat-rows.ps1
      - name: Original-source reply preview red control
        if: matrix.feature == 'reply' && inputs.tag == '' && !startsWith(github.ref_name, 'verify-release/')
        shell: pwsh
        run: |
          $source = Join-Path $env:RUNNER_TEMP 'reply-original-source'
          $prefix = Join-Path $env:GITHUB_WORKSPACE 'reply-original-bin'
          git worktree add --detach $source 570ac52
          if ($LASTEXITCODE -ne 0) { throw 'Original reply source unavailable' }
          Push-Location $source
          try {
            zig build '-Dtarget=x86_64-windows-gnu' --release=small '-Dversion=${{ env.BASE_APP_VERSION }}' --prefix $prefix
            if ($LASTEXITCODE -ne 0) { throw 'Original reply build failed' }
          } finally { Pop-Location }
          pwsh -NoProfile -File tools/verify-wazig/run.ps1 -Feature reply -Bin reply-original-bin/bin -Evidence reply-red-evidence
          if ($LASTEXITCODE -eq 0) { throw 'Original source unexpectedly shows reply preview' }
          $failure = Get-Content reply-red-evidence/failure.txt -Raw
          if ($failure -notmatch 'Reply preview missing') { throw "Wrong reply red failure: $failure" }
          $originalLog = Get-Content reply-red-evidence/final-data/launch-log.txt -Raw
          if ($originalLog -notmatch 'Replying to Fixture Sender') { throw 'Original source did not select Reply' }
          New-Item verification-evidence -ItemType Directory -Force | Out-Null
          Copy-Item reply-red-evidence verification-evidence/red-control -Recurse
          'REPLY_ORIGINAL_RED_OK: Reply preview missing' | Set-Content verification-evidence/reply-red-control.txt
          exit 0
      - name: Sent ordering historical red control
        if: matrix.feature == 'slack-sort' && inputs.tag == '' && !startsWith(github.ref_name, 'verify-release/')
        shell: pwsh
        run: |
          $source = Join-Path $env:RUNNER_TEMP 'sent-order-original'
          $prefix = Join-Path $env:GITHUB_WORKSPACE 'sent-order-original-bin'
          git worktree add --detach $source 7dc3001
          if ($LASTEXITCODE -ne 0) { throw 'Original ordering source unavailable' }
          Push-Location $source
          try {
            zig build '-Dtarget=x86_64-windows-gnu' --release=small '-Dversion=${{ env.BASE_APP_VERSION }}' --prefix $prefix
            if ($LASTEXITCODE -ne 0) { throw 'Original ordering build failed' }
          } finally { Pop-Location }
          $env:VERIFY_VIEW_MODIFIER = '^'
          pwsh -NoProfile -File tools/verify-wazig/run.ps1 -Feature slack-sort -Bin sent-order-original-bin/bin -Evidence verification-evidence/red-control
          if ($LASTEXITCODE -eq 0) { throw 'Original ordering unexpectedly passed stale WhatsApp sends' }
          $failure = Get-Content verification-evidence/red-control/failure.txt -Raw
          if ($failure -notmatch 'WhatsApp wa-sent last message order') { throw "Wrong ordering red failure: $failure" }
          New-Item verification-evidence -ItemType Directory -Force | Out-Null
          'SENT_ORDER_ORIGINAL_RED_OK: WhatsApp wa-sent last message order' | Set-Content verification-evidence/sent-order-red-control.txt
          exit 0
      - name: Capture published font baseline
        if: matrix.feature == 'appearance'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v0.9.224'
          $name = "Postbox-$tag.zip"
          $evidence = 'verification-evidence/font-baseline'
          New-Item $evidence -ItemType Directory -Force | Out-Null
          gh release download $tag --repo $env:GITHUB_REPOSITORY --pattern $name --pattern 'SHA256SUMS.txt' --dir $evidence
          if ($LASTEXITCODE -ne 0) { throw 'Published baseline download failed' }
          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $release.tag_name -cne $tag) { throw 'Published baseline metadata unavailable' }
          $asset = @($release.assets | Where-Object name -CEQ $name)
          $package = Join-Path $evidence $name
          $hash = (Get-FileHash $package -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($asset.Count -ne 1 -or $asset[0].digest -cne "sha256:$hash") { throw 'Published baseline package digest mismatch' }
          $lines = @(Get-Content (Join-Path $evidence 'SHA256SUMS.txt') | Where-Object { $_ -cmatch ("^[0-9a-fA-F]{64} [ *]" + [regex]::Escape($name) + '$') })
          if ($lines.Count -ne 1 -or $lines[0].Substring(0, 64).ToLowerInvariant() -cne $hash) { throw 'Published baseline checksum mismatch' }
          @{ tag = $tag; asset_name = $name; asset_digest = $asset[0].digest; package_sha256 = $hash } | ConvertTo-Json | Set-Content (Join-Path $evidence 'published-font-package.json')
          $release | ConvertTo-Json -Depth 20 | Set-Content (Join-Path $evidence 'published-font-release.json')
          Expand-Archive $package font-baseline-bin/bin
          pwsh -NoProfile -File tools/verify-wazig/run.ps1 -Feature appearance -FontBaseline -ExpectedVersion 0.9.224 -Bin font-baseline-bin/bin -Evidence $evidence
          if ($LASTEXITCODE -ne 0) { throw 'Published font baseline capture failed' }
      - name: Download the shared candidate desktop
        if: ${{ inputs.tag == '' && !startsWith(github.ref_name, 'verify-release/') }}
        uses: actions/download-artifact@v4
        with:
          name: Postbox-candidate
          path: zig-out/bin
      - name: Use the shared candidate desktop
        if: ${{ inputs.tag == '' && !startsWith(github.ref_name, 'verify-release/') }}
        shell: pwsh
        run: |
          if (-not (Test-Path zig-out/bin/Messages.exe)) { throw 'Shared candidate build is missing Messages.exe' }
          'VERIFY_VERSION=${{ env.BASE_APP_VERSION }}' >> $env:GITHUB_ENV
      - name: Download published release
        if: ${{ inputs.tag != '' || startsWith(github.ref_name, 'verify-release/') }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $env:RELEASE_TAG = $env:RELEASE_TAG -replace '^verify-release/', ''
          if ($env:RELEASE_TAG -notmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') { throw 'Invalid release tag' }
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --pattern "Postbox-$env:RELEASE_TAG.zip" --dir candidate
          if ($LASTEXITCODE -ne 0) { throw 'Published package download failed' }
          Expand-Archive "candidate/Postbox-$env:RELEASE_TAG.zip" zig-out/bin
          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:RELEASE_TAG" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Published package metadata unavailable' }
          $asset = @($release.assets | Where-Object name -CEQ "Postbox-$env:RELEASE_TAG.zip")
          if ($asset.Count -ne 1 -or $asset[0].digest -cne ('sha256:' + (Get-FileHash "candidate/Postbox-$env:RELEASE_TAG.zip").Hash.ToLowerInvariant())) { throw 'Published package digest mismatch' }
          New-Item verification-evidence -ItemType Directory -Force | Out-Null
          $release | ConvertTo-Json -Depth 20 | Set-Content verification-evidence/published-package.json
          (Get-FileHash zig-out/bin/Messages.exe).Hash | Set-Content verification-evidence/published-executable.sha256
          "VERIFY_VERSION=$($env:RELEASE_TAG.Substring(1))" >> $env:GITHUB_ENV
      - name: Build and capture the pre-change sidebar baseline
        if: matrix.feature == 'sidebar-surface'
        shell: pwsh
        run: |
          python tools/verify-wazig/test-sidebar-surface.py
          if ($LASTEXITCODE -ne 0) { throw 'Sidebar pixel oracle controls failed' }
          $candidate = (git rev-parse HEAD).Trim()
          $assertion = (git log --diff-filter=A --format=%H -- tools/verify-wazig/journey-sidebar-surface.ps1 | Select-Object -Last 1).Trim()
          $baseline = (git rev-parse "$assertion^1").Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Sidebar assertion parent missing' }
          $source = Join-Path $env:RUNNER_TEMP 'sidebar-baseline-source'
          $prefix = Join-Path $env:GITHUB_WORKSPACE 'sidebar-baseline-bin'
          git worktree add --detach $source $baseline
          if ($LASTEXITCODE -ne 0) { throw 'Sidebar baseline checkout failed' }
          Push-Location $source
          try {
            zig build '-Dtarget=x86_64-windows-gnu' --release=small '-Dversion=${{ env.BASE_APP_VERSION }}' --prefix $prefix
            if ($LASTEXITCODE -ne 0) { throw 'Sidebar baseline build failed' }
          } finally { Pop-Location }
          New-Item verification-evidence -ItemType Directory -Force | Out-Null
          $env:GITHUB_SHA = $baseline
          try {
            & tools/verify-wazig/run.ps1 -Feature sidebar-surface -ExpectedProduct Wazig -Bin sidebar-baseline-bin/bin -Evidence verification-evidence/baseline
            if ($LASTEXITCODE -ne 0) { throw 'Sidebar baseline capture failed' }
          } finally { $env:GITHUB_SHA = $candidate }
          $fixtureText = [IO.File]::ReadAllText((Join-Path $env:GITHUB_WORKSPACE 'src/verify_text.json')).Replace("`r`n", "`n")
          $fixtureBytes = [Text.Encoding]::UTF8.GetBytes($fixtureText)
          $fixtureHash = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($fixtureBytes))
          @{
            candidate_commit = $candidate; baseline_commit = $baseline; assertion_commit = $assertion
            assertion_parent = (git rev-parse "$assertion^1").Trim()
            candidate_sha256 = (Get-FileHash zig-out/bin/Messages.exe).Hash
            baseline_sha256 = (Get-FileHash sidebar-baseline-bin/bin/Messages.exe).Hash
            fixture_sha256 = $fixtureHash
          } | ConvertTo-Json | Set-Content verification-evidence/sidebar-builds.json
      - name: IGSH-949 original-main red control for provider archive
        if: matrix.feature == 'hub-archive'
        shell: pwsh
        run: |
          $baseline = 'a956b59'
          $source = Join-Path $env:RUNNER_TEMP 'provider-archive-baseline'
          $prefix = Join-Path $env:GITHUB_WORKSPACE 'archive-baseline-bin'
          git worktree add --detach $source $baseline
          if ($LASTEXITCODE -ne 0) { throw 'Archive baseline checkout failed' }
          Push-Location $source
          try {
            zig build '-Dtarget=x86_64-windows-gnu' --release=small '-Dversion=${{ env.BASE_APP_VERSION }}' --prefix $prefix
            if ($LASTEXITCODE -ne 0) { throw 'Archive baseline build failed' }
          } finally { Pop-Location }
          pwsh -NoProfile -File tools/verify-wazig/run.ps1 -Feature hub-archive -ExpectedProduct Wazig -Bin archive-baseline-bin/bin -Evidence archive-red-evidence
          if ($LASTEXITCODE -eq 0) { throw 'Original main unexpectedly passed provider archive' }
          $failure = Get-Content archive-red-evidence/failure.txt -Raw
          if ($failure -notmatch 'WhatsApp did not acknowledge archive') { throw "Wrong red control failure: $failure" }
          New-Item verification-evidence -ItemType Directory -Force | Out-Null
          Copy-Item archive-red-evidence verification-evidence/red-control -Recurse
          'IGSH-949 ORIGINAL MAIN RED VERIFIED: WhatsApp did not acknowledge archive' | Set-Content verification-evidence/red-control.txt
          exit 0
      - name: IGSH-1127 original-source notification red control
        if: matrix.feature == 'hub-archive'
        shell: pwsh
        run: |
          $baseline = 'a72caf4'
          $source = Join-Path $env:RUNNER_TEMP 'notification-baseline'
          $prefix = Join-Path $env:GITHUB_WORKSPACE 'notification-baseline-bin'
          git worktree add --detach $source $baseline
          if ($LASTEXITCODE -ne 0) { throw 'Notification baseline checkout failed' }
          Push-Location $source
          try {
            zig build '-Dtarget=x86_64-windows-gnu' --release=small '-Dversion=${{ env.BASE_APP_VERSION }}' --prefix $prefix
            if ($LASTEXITCODE -ne 0) { throw 'Notification baseline build failed' }
          } finally { Pop-Location }
          pwsh -NoProfile -File tools/verify-wazig/run.ps1 -Feature hub-archive -Bin notification-baseline-bin/bin -Evidence notification-red-evidence
          if ($LASTEXITCODE -eq 0) { throw 'Original source unexpectedly notified' }
          Copy-Item notification-red-evidence verification-evidence/notification-red-control -Recurse
          $failure = Get-Content notification-red-evidence/failure.txt -Raw
          if ($failure -notmatch 'incoming archived desktop notification') { throw "Wrong notification red failure: $failure" }
          'IGSH-1127 ORIGINAL SOURCE RED VERIFIED: incoming archived desktop notification' | Set-Content verification-evidence/notification-red-control.txt
          exit 0
      - name: IGSH-1120 original renderer rejects visible source marks
        if: matrix.feature == 'appearance'
        shell: pwsh
        run: |
          $baseline = '2653484'
          $source = Join-Path $env:RUNNER_TEMP 'chat-design-baseline'
          $prefix = Join-Path $env:GITHUB_WORKSPACE 'chat-design-baseline-bin'
          git worktree add --detach $source $baseline
          if ($LASTEXITCODE -ne 0) { throw 'Chat design baseline checkout failed' }
          Push-Location $source
          try {
            zig build '-Dtarget=x86_64-windows-gnu' --release=small '-Dversion=${{ env.BASE_APP_VERSION }}' --prefix $prefix
            if ($LASTEXITCODE -ne 0) { throw 'Chat design baseline build failed' }
          } finally { Pop-Location }
          pwsh -NoProfile -File tools/verify-wazig/run.ps1 -Feature appearance -Bin chat-design-baseline-bin/bin -Evidence chat-design-red-evidence
          if ($LASTEXITCODE -eq 0) { throw 'Original renderer unexpectedly passed chat formatting' }
          $failure = Get-Content chat-design-red-evidence/failure.txt -Raw
          if ($failure -notmatch 'Visible markup: bold stars still painted') { throw "Wrong chat design red failure: $failure" }
          New-Item verification-evidence -ItemType Directory -Force | Out-Null
          Copy-Item chat-design-red-evidence verification-evidence/chat-design-red-control -Recurse
          'IGSH-1120 ORIGINAL RENDERER RED VERIFIED: visible bold stars' | Set-Content verification-evidence/chat-design-red-control.txt
          exit 0
      - name: IGSH-1196 original group renderer red control
        if: matrix.feature == 'appearance'
        shell: pwsh
        run: |
          $source = Join-Path $env:RUNNER_TEMP 'group-senders-baseline'
          $prefix = Join-Path $env:GITHUB_WORKSPACE 'group-senders-baseline-bin'
          git worktree add --detach $source 9ad8d25
          if ($LASTEXITCODE -ne 0) { throw 'Group baseline checkout failed' }
          Push-Location $source
          try {
            zig build '-Dtarget=x86_64-windows-gnu' --release=small '-Dversion=${{ env.BASE_APP_VERSION }}' --prefix $prefix
            if ($LASTEXITCODE -ne 0) { throw 'Group baseline build failed' }
          } finally { Pop-Location }
          pwsh -NoProfile -File tools/verify-wazig/run.ps1 -Feature appearance -Bin group-senders-baseline-bin/bin -Evidence group-senders-red-evidence
          if ($LASTEXITCODE -eq 0) { throw 'Original source unexpectedly passed group sender layout' }
          $failure = Get-Content group-senders-red-evidence/failure.txt -Raw
          if ($failure -notmatch 'Incoming messages left the centred column') { throw "Wrong group red failure: $failure" }
          New-Item verification-evidence -ItemType Directory -Force | Out-Null
          Copy-Item group-senders-red-evidence verification-evidence/group-senders-red-control -Recurse
          'GROUP_ORIGINAL_RED_OK: original incoming messages have no avatar gutter' | Set-Content verification-evidence/group-senders-red-control.txt
          exit 0
      - name: Voice repaint pixel controls
        if: matrix.feature == 'voice'
        shell: pwsh
        run: tools/verify-wazig/test-voice-pixels.ps1
      - name: Real playback rejects the original missing output device
        if: matrix.feature == 'voice' && inputs.tag == '' && !startsWith(github.ref_name, 'verify-release/')
        shell: pwsh
        run: |
          Stop-Service Audiosrv -Force -ErrorAction SilentlyContinue
          pwsh -NoProfile -File tools/verify-wazig/run.ps1 -Feature voice -Bin zig-out/bin -Evidence verification-evidence/no-output -ExpectedVersion $env:VERIFY_VERSION
          if ($LASTEXITCODE -eq 0) { throw 'Missing audio output unexpectedly played' }
          $failure = Get-Content verification-evidence/no-output/failure.txt -Raw
          if ($failure -notmatch 'voice: downloaded playback position advances') { throw "Wrong audio negative control failure: $failure" }
          'VOICE_NO_OUTPUT_RED_OK' | Set-Content verification-evidence/audio-red-control.txt
          exit 0
      - name: Install isolated signed audio output
        if: matrix.feature == 'voice'
        shell: pwsh
        run: tools/verify-wazig/install-audio.ps1
      - name: Queued-send voice download historical red control
        if: matrix.feature == 'voice' && inputs.tag == '' && !startsWith(github.ref_name, 'verify-release/')
        shell: pwsh
        run: |
          $original = [IO.File]::ReadAllText('src/main.zig')
          try {
            python tools/verify-wazig/voice-download-red.py
            if ($LASTEXITCODE -ne 0) { throw 'Historical download extraction failed' }
            zig build '-Dtarget=x86_64-windows-gnu' --release=small '-Dversion=${{ env.BASE_APP_VERSION }}' --prefix voice-red-bin
            if ($LASTEXITCODE -ne 0) { throw 'Historical media build failed' }
          } finally { [IO.File]::WriteAllText('src/main.zig', $original) }
          $failed = $false
          try {
            & tools/verify-wazig/run.ps1 -Feature voice -Bin voice-red-bin/bin -Evidence voice-red-evidence
          } catch { $failed = $true }
          if (-not $failed) { throw 'Historical queued-send starvation escaped verification' }
          $reason = Get-Content voice-red-evidence/failure.txt -Raw
          if (-not $reason.Contains('new voice downloads despite queued send')) { throw "Wrong red failure: $reason" }
          New-Item verification-evidence -ItemType Directory -Force | Out-Null
          Copy-Item voice-red-evidence/failure.txt verification-evidence/voice-download-red.txt
          'HISTORICAL_VOICE_STARVATION_CAUGHT' | Add-Content verification-evidence/voice-download-red.txt
      - name: Real playback rejects the original invalid voice fixture
        if: matrix.feature == 'voice' && inputs.tag == '' && !startsWith(github.ref_name, 'verify-release/')
        shell: pwsh
        run: |
          $fixture = 'tools/verify-wazig/voice-note.ogg'
          $valid = [IO.File]::ReadAllBytes($fixture)
          try {
            $old = [byte[]]([Text.Encoding]::ASCII.GetBytes('OggS') + (@(0..255) * 8))
            [IO.File]::WriteAllBytes($fixture, $old)
            pwsh -NoProfile -File tools/verify-wazig/run.ps1 -Feature voice -Bin zig-out/bin -Evidence verification-evidence/invalid-opus -ExpectedVersion $env:VERIFY_VERSION
            if ($LASTEXITCODE -eq 0) { throw 'Original invalid voice fixture unexpectedly played' }
            $failure = Get-Content verification-evidence/invalid-opus/failure.txt -Raw
            if ($failure -notmatch 'voice: downloaded playback position advances') { throw "Wrong invalid Opus failure: $failure" }
          } finally { [IO.File]::WriteAllBytes($fixture, $valid) }
          'VOICE_INVALID_OPUS_RED_OK' | Set-Content verification-evidence/invalid-opus-red-control.txt
          exit 0
      - name: Original chat bubble fails approved icon regression
        if: matrix.feature == 'app-icon'
        shell: pwsh
        run: |
          New-Item verification-evidence -ItemType Directory -Force | Out-Null
          python -c "import subprocess,sys; sys.path.insert(0,'tools'); from test_app_icon import check_icon; check_icon(subprocess.check_output(['git','show','9ad8d25:assets/messages.ico']))" *> verification-evidence/icon-red-control.txt
          if ($LASTEXITCODE -eq 0) { throw 'Original chat bubble unexpectedly passed' }
          $failure = Get-Content verification-evidence/icon-red-control.txt -Raw
          if ($failure -notmatch 'Green front bubble missing|Grey back bubble missing|Missing app icon sizes') { throw "Wrong icon red failure: $failure" }
          'ORIGINAL_CHAT_BUBBLE_RED_OK' | Add-Content verification-evidence/icon-red-control.txt
          exit 0
      - name: Install typing recorder
        if: matrix.feature == 'drafts' || matrix.feature == 'media-fit'
        shell: pwsh
        run: tools/verify-wazig/install-ffmpeg.ps1
      - name: Launch, doctor and drive
        shell: pwsh
        env:
          REPEAT: ${{ inputs.repeat || '1' }}
          FEATURE: ${{ matrix.feature }}
          VALIDATE_EVIDENCE: ${{ matrix.evidence }}
        run: |
          if ($env:REPEAT -notmatch '^[1-3]$') { throw 'repeat must be 1, 2 or 3' }
          $failed = $false
          for ($i = 1; $i -le [int]$env:REPEAT; $i++) {
            $evidence = if ($i -eq 1) { 'verification-evidence' } else { "verification-evidence/repeat-$i" }
            pwsh -NoProfile -File tools/verify-wazig/run.ps1 -Feature $env:FEATURE -Bin zig-out/bin -Evidence $evidence -ExpectedVersion $env:VERIFY_VERSION
            $code = $LASTEXITCODE
            if ($code -eq 0 -and $env:VALIDATE_EVIDENCE -eq 'true') {
              python tools/verify-wazig/check-evidence.py $evidence
              $code = $LASTEXITCODE
            }
            if ($code -eq 0) {
              Write-Host "Run ${i}: PASS"
            } else {
              $failed = $true
              $failure = Join-Path $evidence 'failure.txt'
              $reason = if (Test-Path $failure) { (Get-Content $failure -Raw).Trim() } else { 'launch, drive or evidence validation failed; see log' }
              Write-Host "Run ${i}: FAIL: $reason"
            }
          }
          if ($failed) { throw 'One or more journey runs failed' }
      - name: Validate surviving journey evidence
        if: matrix.evidence
        shell: pwsh
        run: |
          python tools/verify-wazig/check-evidence.py verification-evidence
          if ($LASTEXITCODE -ne 0) { throw 'Invalid journey evidence' }
      - name: Compare published and candidate font evidence
        if: matrix.feature == 'appearance'
        shell: pwsh
        run: |
          python tools/verify-wazig/check-font-baseline.py verification-evidence/font-baseline verification-evidence
          if ($LASTEXITCODE -ne 0) { throw 'Font baseline comparison failed' }
      - name: Archive rows through the production renderer with a light fixture palette
        if: matrix.feature == 'show-archived'
        shell: pwsh
        run: pwsh -NoProfile -File tools/verify-wazig/verify-archive-light.ps1
      - name: Verify offline palette and unconfigured backend after unified search
        if: matrix.feature == 'search'
        shell: pwsh
        run: |
          pwsh -NoProfile -File tools/verify-wazig/run.ps1 -Feature palette -Bin zig-out/bin -Evidence verification-evidence/palette
          if ($LASTEXITCODE -ne 0) { throw 'Palette journey failed' }
          python tools/verify-wazig/check-evidence.py verification-evidence/palette
          if ($LASTEXITCODE -ne 0) { throw 'Invalid palette evidence' }
      - name: ISSUE-462 validate text comparison artifact
        if: matrix.feature == 'text-comparison'
        shell: pwsh
        run: |
          node tools/verify-wazig/check-text-comparison.cjs verification-evidence
          if ($LASTEXITCODE -ne 0) { throw 'Invalid comparison evidence' }
      - name: Cleanup even after a failed journey
        if: always()
        shell: pwsh
        run: pwsh -NoProfile -File tools/verify-wazig/cleanup.ps1 -Evidence verification-evidence
      - name: Validate menus evidence
        if: success() && matrix.feature == 'menus'
        shell: pwsh
        run: |
          python tools/verify-wazig/check-evidence.py verification-evidence
          if ($LASTEXITCODE -ne 0) { throw 'Invalid menus evidence' }
      - name: Validate archive evidence
        if: ${{ success() && inputs.feature == 'archive' }}
        run: python tools/verify-wazig/check-evidence.py verification-evidence
      - name: Record clean result
        if: always()
        shell: pwsh
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          New-Item verification-evidence -ItemType Directory -Force | Out-Null
          $env:JOB_STATUS | Set-Content verification-evidence/clean-result.txt
      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-wazig-${{ matrix.feature }}
          path: verification-evidence/
          if-no-files-found: error
  verify-verdict:
    name: verify-verdict
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs: [plan, base-fails, verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Report verifier verdict
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 tools/verify-wazig/verdict.py
