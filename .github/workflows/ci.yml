name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pin-icon-tests:
    name: pin-icon-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: IGSH-494 pin geometry
        run: zig test src/pin_icon_test.zig
      - name: IGSH-494 pin source regression and negative controls
        if: ${{ !cancelled() }}
        run: python3 tools/test_pin_icon.py

  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: No new code comments
        run: python3 tools/check_new_comments.py

      - name: Python tooling tests
        run: python3 -m unittest discover -s tools -p 'test_*.py'

      - name: Cache keys skip workflow files
        run: python3 tools/check_cache_keys.py

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Zig version
        run: zig version

      - name: ISSUE-517 voice transcription and historical negative control
        run: python3 tools/check_voice_transcription_regression.py --zig "$(command -v zig)"

      - name: Preflight
        run: ZIG=zig bash tools/preflight.sh

      - name: Compile ARM64 release
        run: zig build -Dtarget=aarch64-windows-gnu --release=small -p zig-out-arm64

      - name: Agent guard tests
        run: |
          git fetch --quiet --no-tags origin '+refs/pull/*/head:refs/remotes/pr/*'
          bash tools/test-preflight-guard.sh
          bash tools/test-agent-setup.sh
          bash tools/test-lint-repeats.sh
          bash tools/test-ci-green.sh
          bash tools/test-ai-review.sh

      - name: Outbox lifecycle and regression controls
        run: python3 tools/test_outbox_runtime.py --zig "$(command -v zig)" --negative-controls

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Messages-windows-x86_64
          path: zig-out/bin/

  tdlib-cache:
    uses: ./.github/workflows/tdlib-cache.yml

  tdlib:
    needs: tdlib-cache
    name: tdlib
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-mingw-w64-x86-64 gperf php-cli cmake ninja-build

      - name: TDLib revision
        id: tdlib
        run: echo "commit=$(cat tools/TDLIB_COMMIT)" >> "$GITHUB_OUTPUT"

      - name: Restore TDLib
        id: tdcache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: /tmp/tdlib-install
          key: tdlib-${{ steps.tdlib.outputs.commit }}-${{ hashFiles('tools/build-tdlib.sh') }}

      - name: Build TDLib
        if: steps.tdcache.outputs.cache-hit != 'true'
        run: bash tools/build-tdlib.sh

      - name: Build with Telegram (placeholder credentials)
        run: |
          zig build -Dtarget=x86_64-windows-gnu --release=small \
            -Dtdlib=/tmp/tdlib-install \
            -Dtelegram-api-id=1 \
            -Dtelegram-api-hash=smoke-placeholder

      - name: Verify x64 TDLib
        run: python3 -c 'from pathlib import Path; assert b"setTdlibParameters" in Path("zig-out/bin/Messages.exe").read_bytes(), "x64 build is missing TDLib"'

      - name: Exe size report
        run: |
          du -h zig-out/bin/Messages.exe

      - name: Upload Telegram build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Messages-windows-x86_64-telegram
          path: zig-out/bin/

  windows-smoke:
    name: windows-smoke
    runs-on: windows-latest
    needs: tdlib
    timeout-minutes: 10
    steps:
      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: Messages-windows-x86_64-telegram
          path: bin/

      - name: Run TDLib smoke
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "bin\Messages.exe" -ArgumentList "--tdlib-smoke" -Wait -PassThru
          exit $p.ExitCode

  unfurl-verification:
    name: unfurl-verification
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: ISSUE-517 isolated Windows user key loading
        run: zig test src/environment_keys.zig -lc -ladvapi32 -lkernel32 -lcrypt32 --test-filter ISSUE-517

      - name: ISSUE-545 row-sized paint buffer pixel placement
        run: zig test src/smooth_shapes.zig -lc -lgdi32 -luser32 -lmsimg32 --test-filter ISSUE-545

      - name: Build Messages.exe
        run: zig build -Dtarget=x86_64-windows-gnu --release=small

      - name: Run unfurl smoke on this Windows machine
        shell: pwsh
        env:
          UNFURL_SMOKE_DIR: smoke-out
          UNFURL_SMOKE_VIDEO: ${{ github.workspace }}\tools\fixtures\smoke-clip.mp4
        run: |
          $p = Start-Process -FilePath "zig-out\bin\Messages.exe" -ArgumentList "--unfurl-smoke" -Wait -PassThru
          if (Test-Path "smoke-out\results.txt") { Get-Content "smoke-out\results.txt" | Write-Host }
          exit $p.ExitCode

      - name: Upload unfurl evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unfurl-verification-evidence
          path: smoke-out/

  notify-release:
    name: notify-release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [ci, tdlib, windows-smoke]
    permissions:
      actions: write
    steps:
      - name: Hand off to auto-release
        if: >-
          success() &&
          github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in 1 2 3; do
            if gh workflow run auto-release.yml -R "${GITHUB_REPOSITORY}" --ref main; then
              exit 0
            fi
            sleep 5
          done
          exit 1
