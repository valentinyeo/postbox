name: ci

on:
  push:
    branches: [main]
  pull_request:
  # automerge.yml dispatches ci on main after a GITHUB_TOKEN squash merge,
  # because merges made with that token do not fire the push trigger.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Comment checker tests
        run: python3 -m unittest discover -s tools -p 'test_*.py'

      - name: Cache keys skip workflow files
        run: python3 tools/check_cache_keys.py

      - name: No new code comments
        if: github.event_name == 'pull_request'
        run: python3 tools/check_new_comments.py "${{ github.event.pull_request.base.sha }}" HEAD

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Zig version
        run: zig version

      - name: Preflight
        run: ZIG=zig bash tools/preflight.sh

      - name: Agent guard tests
        run: |
          git fetch --quiet --no-tags origin '+refs/pull/*/head:refs/remotes/pr/*'
          bash tools/test-preflight-guard.sh
          bash tools/test-agent-setup.sh
          bash tools/test-lint-repeats.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Messages-windows-x86_64
          path: zig-out/bin/

  tdlib:
    name: tdlib
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TDLIB_COMMIT: d1085f9cebc5a62379991ae1652673954f229c1f
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-mingw-w64-x86-64 gperf php-cli cmake ninja-build

      - name: Restore TDLib
        id: tdcache
        uses: actions/cache@v4
        with:
          path: |
            /tmp/tdlib-install
            /tmp/tdbuild-prefix
          key: tdlib-${{ env.TDLIB_COMMIT }}-${{ hashFiles('tools/build-tdlib.sh') }}

      - name: Build TDLib
        if: steps.tdcache.outputs.cache-hit != 'true'
        run: bash tools/build-tdlib.sh

      # Placeholder credentials: this artifact exists for the Windows smoke
      # test only, and workflow artifacts are readable by anyone with repo
      # access, so the real API credentials are compiled in exclusively by
      # release.yml.
      - name: Build with Telegram (placeholder credentials)
        run: |
          zig build -Dtarget=x86_64-windows-gnu --release=small \
            -Dtdlib=/tmp/tdlib-install \
            -Dtelegram-api-id=1 \
            -Dtelegram-api-hash=smoke-placeholder

      - name: Exe size report
        run: |
          du -h zig-out/bin/Messages.exe

      - name: Upload Telegram build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Messages-windows-x86_64-telegram
          path: zig-out/bin/

  # Runs the Telegram-enabled exe headlessly on a real Windows machine to
  # prove TDLib loads, opens its database and reaches the first auth state.
  windows-smoke:
    name: windows-smoke
    runs-on: windows-latest
    needs: tdlib
    timeout-minutes: 10
    steps:
      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: Messages-windows-x86_64-telegram
          path: bin/

      - name: Run TDLib smoke
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "bin\Messages.exe" -ArgumentList "--tdlib-smoke" -Wait -PassThru
          exit $p.ExitCode

  # WAZI-68 affected-machine verification: runs the shipped unfurl code
  # (link classifier, live card fetch, card painter, MFPlay player window,
  # fullscreen toggle) on a real Windows desktop, without a WhatsApp
  # session, and uploads the screenshots and result log as evidence.
  unfurl-verification:
    name: unfurl-verification
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build Messages.exe
        run: zig build -Dtarget=x86_64-windows-gnu --release=small

      - name: Run unfurl smoke on this Windows machine
        shell: pwsh
        env:
          UNFURL_SMOKE_DIR: smoke-out
        run: |
          $p = Start-Process -FilePath "zig-out\bin\Messages.exe" -ArgumentList "--unfurl-smoke" -Wait -PassThru
          if (Test-Path "smoke-out\results.txt") { Get-Content "smoke-out\results.txt" | Write-Host }
          exit $p.ExitCode

      - name: Upload unfurl evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unfurl-verification-evidence
          path: smoke-out/

  # A ci run on main that was started by workflow_dispatch (the automerge
  # bot-merge path and the automerge self-heal) gets no downstream
  # workflow_run trigger: GitHub does not fire workflow_run for runs that
  # were themselves dispatched. Push-triggered ci runs already start
  # auto-release through workflow_run, so this handoff is dispatch-only.
  notify-release:
    name: notify-release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [ci, tdlib, windows-smoke]
    # success() must stay explicit: a job-level if replaces the implicit
    # all-dependencies-succeeded check.
    if: >-
      success() &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main'
    permissions:
      actions: write
    steps:
      - name: Hand off to auto-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # auto-release re-verifies everything itself (head of main, tag
          # dedupe, app-files-changed) before it tags anything.
          # Retry transient dispatch failures: this handoff is the only
          # auto-release trigger for heads without a push-triggered ci run.
          for _ in 1 2 3; do
            if gh workflow run auto-release.yml -R "${GITHUB_REPOSITORY}" --ref main; then
              exit 0
            fi
            sleep 5
          done
          exit 1
