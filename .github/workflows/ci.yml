name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pin-icon-tests:
    name: pin-icon-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: IGSH-494 pin geometry
        run: zig test src/pin_icon_test.zig
      - name: IGSH-494 pin source regression and negative controls
        if: ${{ !cancelled() }}
        run: python3 tools/test_pin_icon.py

  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: No new code comments
        run: python3 tools/check_new_comments.py

      - name: Python tooling tests
        run: python3 -m unittest discover -s tools -p 'test_*.py'

      - name: Cache keys skip workflow files
        run: python3 tools/check_cache_keys.py

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Zig version
        run: zig version

      - name: ISSUE-517 voice transcription and historical negative control
        run: python3 tools/check_voice_transcription_regression.py --zig "$(command -v zig)"

      - name: Preflight
        run: ZIG=zig bash tools/preflight.sh

      - name: IGSH-833 incoming message regression on main before the fix
        run: |
          set -euo pipefail
          cp src/main.zig "$RUNNER_TEMP/igsh833-main.zig"
          git show 151e5b6ec06b2bff1d587c7ef5a232d4291973dc:src/main.zig > src/main.zig
          set +e
          zig build test > "$RUNNER_TEMP/igsh833-old.log" 2>&1
          status=$?
          set -e
          cp "$RUNNER_TEMP/igsh833-main.zig" src/main.zig
          if [ "$status" -eq 0 ]; then echo 'Plain archives unexpectedly returned on old main'; exit 1; fi
          if ! grep -qE "test\.IGSH-833 bulk plain group and direct chat return on an incoming message while kept stays archived.*failed" "$RUNNER_TEMP/igsh833-old.log"; then
            cat "$RUNNER_TEMP/igsh833-old.log"
            exit 1
          fi
          echo 'IGSH-833 old main fails the incoming message regression'

      - name: IGSH-767 archive intent and historical negative control
        run: |
          set -euo pipefail
          path=src/archive_rules.zig
          cp "$path" "$RUNNER_TEMP/archive_rules.zig"
          fixed='if (self.find(key.id) != null) return true;'
          old='if (self.find(key.id)) |index| return self.entries[index].keep;'
          grep -qF "$fixed" "$path" || { echo 'Archive negative control anchor missing'; exit 1; }
          FIXED="$fixed" OLD="$old" python3 -c "import os,sys;p=sys.argv[1];s=open(p,encoding='utf-8').read();open(p,'w',encoding='utf-8').write(s.replace(os.environ['FIXED'],os.environ['OLD']))" "$path"
          set +e
          zig build test > "$RUNNER_TEMP/archive-old.log" 2>&1
          status=$?
          set -e
          cp "$RUNNER_TEMP/archive_rules.zig" "$path"
          if [ "$status" -eq 0 ]; then echo 'Old archive resolution unexpectedly passed'; exit 1; fi
          if ! grep -qE "archive_rules\.test\.WhatsApp archive (entry overrides the provider flag|presence is independent of keep and the provider flag)' failed" "$RUNNER_TEMP/archive-old.log"; then
            echo 'Old archive resolution did not fail the metadata-free regression'
            tail -40 "$RUNNER_TEMP/archive-old.log"
            exit 1
          fi
          echo 'Old archive resolution fails the metadata-free regression'

      - name: Compile ARM64 release
        run: zig build -Dtarget=aarch64-windows-gnu --release=small -p zig-out-arm64

      - name: Agent guard tests
        run: |
          git fetch --quiet --no-tags origin '+refs/pull/*/head:refs/remotes/pr/*'
          bash tools/test-preflight-guard.sh
          bash tools/test-agent-setup.sh
          bash tools/test-lint-repeats.sh
          bash tools/test-ci-green.sh
          bash tools/test-auto-release-pick.sh
          bash tools/test-automerge-admit.sh
          bash tools/test-ai-review.sh

      - name: Outbox lifecycle and regression controls
        run: python3 tools/test_outbox_runtime.py --zig "$(command -v zig)" --negative-controls

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Messages-windows-x86_64
          path: zig-out/bin/

  tdlib-cache:
    name: tdlib-cache / cache
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Reject retired desktop dependencies
        run: python3 tools/check_hub_only.py

  tdlib:
    needs: tdlib-cache
    name: tdlib
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Build hub-only desktop
        run: zig build -Dtarget=x86_64-windows-gnu --release=small -Dversion=0.0.526
      - name: Verify hub-only binary
        run: python3 tools/check_hub_only.py --binary zig-out/bin/Messages.exe
      - name: Exe size report
        run: du -h zig-out/bin/Messages.exe
      - name: Upload Telegram build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Messages-windows-x86_64-telegram
          path: zig-out/bin/

  windows-smoke:
    name: windows-smoke
    runs-on: windows-latest
    needs: tdlib
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: Messages-windows-x86_64-telegram
          path: bin/

      - name: Run hub smoke
        shell: pwsh
        run: |
          tools/verify-wazig/run.ps1 -Feature telegram -Bin bin -Evidence verification-evidence
      - name: Validate hub smoke evidence
        shell: pwsh
        run: python tools/verify-wazig/check-evidence.py verification-evidence
      - name: Cleanup hub smoke
        if: always()
        shell: pwsh
        run: tools/verify-wazig/cleanup.ps1 -Evidence verification-evidence
      - name: Upload hub smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telegram-hub-smoke
          path: verification-evidence/

  unfurl-verification:
    name: unfurl-verification
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: ISSUE-517 isolated Windows user key loading
        run: zig test src/environment_keys.zig -lc -ladvapi32 -lkernel32 -lcrypt32 --test-filter ISSUE-517

      - name: ISSUE-545 row-sized paint buffer pixel placement
        run: zig test src/smooth_shapes.zig -lc -lgdi32 -luser32 -lmsimg32 --test-filter ISSUE-545

      - name: Build Messages.exe
        run: zig build -Dtarget=x86_64-windows-gnu --release=small

      - name: Run unfurl smoke on this Windows machine
        shell: pwsh
        env:
          UNFURL_SMOKE_DIR: smoke-out
          UNFURL_SMOKE_VIDEO: ${{ github.workspace }}\tools\fixtures\smoke-clip.mp4
        run: |
          $p = Start-Process -FilePath "zig-out\bin\Messages.exe" -ArgumentList "--unfurl-smoke" -Wait -PassThru
          if (Test-Path "smoke-out\results.txt") { Get-Content "smoke-out\results.txt" | Write-Host }
          exit $p.ExitCode

      - name: Upload unfurl evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unfurl-verification-evidence
          path: smoke-out/

  notify-release:
    name: notify-release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [ci, tdlib, windows-smoke]
    permissions:
      actions: write
    steps:
      - name: Hand off to auto-release
        if: >-
          success() &&
          github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in 1 2 3; do
            if gh workflow run auto-release.yml -R "${GITHUB_REPOSITORY}" --ref main; then
              exit 0
            fi
            sleep 5
          done
          exit 1
