name: giphy-loopback
on:
  workflow_dispatch:
  schedule:
    - cron: '15 4 * * *'
permissions:
  contents: read
jobs:
  loopback:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Exercise native catalogue HTTP against loopback
        run: python tools/verify-wazig/giphy-loopback.py
      - name: Upload sanitized loopback evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: giphy-loopback-evidence
          path: giphy-loopback-evidence/
          if-no-files-found: warn
