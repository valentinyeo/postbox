name: No code comments

on:
  pull_request:
  schedule:
    - cron: "25 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no-comments:
    name: no-comments
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tools/strip-comments.test.js
      - run: node tools/strip-comments.mjs --check
