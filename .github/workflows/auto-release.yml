name: auto-release

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      bump:
        description: "Which part of the version to bump"
        type: choice
        options: [patch, minor]
        default: patch

concurrency:
  group: auto-release
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  tag:
    name: tag
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Pick the newest CI-green untagged main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          target_sha="$(bash tools/auto-release-pick.sh "${GITHUB_REPOSITORY}" origin/main)"
          if [ -z "${target_sha}" ]; then
            echo "no new CI-green main commit to release"
            echo "skip=true" >> "$GITHUB_ENV"
          else
            echo "target_sha=${target_sha}" >> "$GITHUB_ENV"
            echo "release target is ${target_sha}"
          fi

      - name: Honour [skip release]
        if: env.skip != 'true'
        run: |
          subject="$(git log -1 --pretty=%B "${target_sha}")"
          case "${subject}" in
            *"[skip release]"*|*"[release skip]"*)
              echo "commit asks for no release"
              echo "skip=true" >> "$GITHUB_ENV" ;;
          esac

      - name: Skip if this commit is already released
        if: env.skip != 'true'
        run: |
          tags="$(git tag -l 'v*' --points-at "${target_sha}")"
          if [ -n "${tags}" ]; then
            echo "target already carries a release tag"
            echo "skip=true" >> "$GITHUB_ENV"
          fi

      - name: Release only when the app itself changed
        if: env.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          releases="$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name')"
          last="$(printf '%s\n' "${releases}" | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' | sort -V | tail -1 || true)"
          if [ -z "${last}" ]; then
            echo "no published release, treating as releasable"
            exit 0
          fi

          if git diff --name-only "${last}..${target_sha}" \
             | grep -qE '^(src/|assets/|vendor/|build\.zig)'; then
            echo "app changed since ${last}"
          else
            echo "only non-app files changed since ${last}, no release"
            echo "skip=true" >> "$GITHUB_ENV"
          fi

      - name: Work out the next version
        if: env.skip != 'true'
        env:
          BUMP: ${{ inputs.bump || 'patch' }}
        run: |
          last_tag="$(git tag -l 'v*' | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' | sort -V | tail -1 || true)"
          last_tag="${last_tag:-v0.0.0}"
          v="${last_tag#v}"
          major="${v%%.*}"; rest="${v#*.}"
          minor="${rest%%.*}"; patch="${rest#*.}"
          case "${BUMP}" in
            minor) minor=$((minor + 1)); patch=0 ;;
            *)     patch=$((patch + 1)) ;;
          esac
          next="v${major}.${minor}.${patch}"
          if git rev-parse -q --verify "refs/tags/${next}" >/dev/null; then
            echo "${next} already exists, refusing to move it"
            echo "skip=true" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "next_tag=${next}" >> "$GITHUB_ENV"
          echo "Releasing ${last_tag} -> ${next}"

      - name: Tag it
        if: env.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="${target_sha}"
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f "ref=refs/tags/${next_tag}" -f "sha=${sha}" >/dev/null
          gh workflow run release.yml -R "${GITHUB_REPOSITORY}" --ref "${next_tag}"
          echo "### Released ${next_tag}" >> "$GITHUB_STEP_SUMMARY"
          echo "Tag created and the release workflow dispatched on it." >> "$GITHUB_STEP_SUMMARY"
