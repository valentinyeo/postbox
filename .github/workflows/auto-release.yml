name: auto-release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: "Which part of the version to bump"
        type: choice
        options: [patch, minor]
        default: patch

concurrency:
  group: auto-release
  cancel-in-progress: false
  queue: max

permissions:
  contents: write
  actions: write

jobs:
  tag:
    name: tag
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Require main ref
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Only main can be released"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Select pushed commit
        run: echo "target_sha=${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Skip or retry an existing tag
        if: env.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tags="$(git tag -l 'v*' --points-at "${target_sha}")"
          if [ -n "${tags}" ]; then
            tag="$(printf '%s\n' "$tags" | sort -V | tail -1)"
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "skip=true" >> "$GITHUB_ENV"
            else
              for attempt in 1 2 3 4 5; do
                gh workflow run release.yml -R "$GITHUB_REPOSITORY" --ref "$tag" && break
                [ "$attempt" = 5 ] && exit 1
                sleep 15
              done
              echo "skip=true" >> "$GITHUB_ENV"
            fi
          fi

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Build the app before tagging
        if: env.skip != 'true'
        run: zig build '-Dtarget=x86_64-windows-gnu' --release=small
      - name: Work out the next version
        if: env.skip != 'true'
        env:
          BUMP: ${{ inputs.bump || 'patch' }}
        run: |
          last_tag="$(git tag -l 'v*' | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' | sort -V | tail -1 || true)"
          last_tag="${last_tag:-v0.0.0}"
          v="${last_tag#v}"
          major="${v%%.*}"; rest="${v#*.}"
          minor="${rest%%.*}"; patch="${rest#*.}"
          case "${BUMP}" in
            minor) minor=$((minor + 1)); patch=0 ;;
            *)     patch=$((patch + 1)) ;;
          esac
          next="v${major}.${minor}.${patch}"
          if git rev-parse -q --verify "refs/tags/${next}" >/dev/null; then
            echo "${next} already exists, refusing to move it"
            echo "skip=true" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "next_tag=${next}" >> "$GITHUB_ENV"
          echo "Releasing ${last_tag} -> ${next}"

      - name: Tag it
        if: env.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="${target_sha}"
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f "ref=refs/tags/${next_tag}" -f "sha=${sha}" >/dev/null
          for attempt in 1 2 3 4 5; do
            gh workflow run release.yml -R "${GITHUB_REPOSITORY}" --ref "${next_tag}" && break
            [ "$attempt" = 5 ] && exit 1
            sleep 15
          done
          echo "### Released ${next_tag}" >> "$GITHUB_STEP_SUMMARY"
          echo "Tag created and the release workflow dispatched on it." >> "$GITHUB_STEP_SUMMARY"
