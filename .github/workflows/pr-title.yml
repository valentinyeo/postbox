name: pr-title
on:
  pull_request:
    types: [opened, edited, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-title:
    runs-on: ubuntu-latest
    steps:
      - name: check the PR title says something
        uses: actions/github-script@v7
        with:
          script: |
            const title = (context.payload.pull_request?.title || "").trim();
            const genericRe = /^(update|fix|wip|changes?|misc)\.?$/i;
            if (title.length < 8) {
              core.setFailed(`PR title "${title}" is too short to say what changed`);
              return;
            }
            if (genericRe.test(title)) {
              core.setFailed(`PR title "${title}" is too generic; say what changed`);
              return;
            }
            core.info(`PR title ok: ${title}`);

  update-card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check product update card line
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          jq -r '.pull_request.body // ""' "$GITHUB_EVENT_PATH" > "$RUNNER_TEMP/pr-body.txt"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --paginate --jq '.[] | .filename, (.previous_filename // empty)' > "$RUNNER_TEMP/pr-files.txt"
          python3 tools/update_cards.py check --body-file "$RUNNER_TEMP/pr-body.txt" --files "$RUNNER_TEMP/pr-files.txt"
