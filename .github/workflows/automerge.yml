name: automerge
on:
  workflow_run:
    workflows: ["ci", "No code comments"]
    types: [completed]
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
concurrency:
  group: automerge
  cancel-in-progress: false
permissions:
  contents: write
  pull-requests: write
  actions: write
  checks: read
jobs:
  automerge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Merge green low-risk PRs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          merged_any=0
          required='["ci","tdlib","windows-smoke","no-comments"]'
          for pr in $(gh pr list -R "$REPO" --state open --json number -q '.[].number'); do
            info=$(gh pr view "$pr" -R "$REPO" --json isDraft,labels,additions,deletions,files,mergeable,statusCheckRollup,headRefOid)
            head_oid=$(echo "$info" | jq -r .headRefOid)
            blocked=$(echo "$info" | jq -r --argjson req "$required" '
              ([.statusCheckRollup[]] as $roll
               | [ $req[] as $r
                   | if ([ $roll[] | select(.name == $r and .conclusion == "SUCCESS") ] | length) == 0
                       or ([ $roll[] | select(.name == $r and .conclusion != "SUCCESS") ] | length) > 0
                     then $r else empty end ] )
              | join(",")')
            gating='[".github/workflows/automerge.yml", ".github/workflows/ci.yml", ".github/workflows/no-comments.yml", ".github/workflows/release.yml", ".github/workflows/auto-release.yml"]'
            files_json=$(gh api "repos/$REPO/pulls/$pr/files?per_page=100" --paginate --jq '.[].filename' 2>/dev/null | jq -R . | jq -cs .) || files_json=""
            reason=$(echo "$info" | jq -r '
              if .isDraft then "draft"
              elif ([.labels[].name] | index("hold")) then "hold label"
              elif .mergeable != "MERGEABLE" then "not mergeable (\(.mergeable))"
              else "" end') || reason="could not evaluate PR state"
            if [ "${reason}" = "null" ]; then reason="could not evaluate PR state"; fi
            if [ -z "${reason}" ]; then
              gated=$(echo "${files_json}" | jq -r --argjson gate "$gating" '[.[] | select(. == $gate[])] | length' 2>/dev/null) || gated=""
              if [ -z "${files_json}" ] || ! [ -n "${gated}" ] || ! [ "${gated}" -ge 0 ] 2>/dev/null; then
                reason="could not list PR files"
              elif [ "${gated}" -ge 1 ]; then
                reason="edits a release-gating workflow, needs manual review"
              fi
            fi
            if [ -n "$blocked" ]; then reason="required checks not green: ${blocked}"; fi
            if [ -n "$reason" ]; then echo "#$pr: skip ($reason)"; continue; fi
            if gh pr merge "$pr" -R "$REPO" --squash --delete-branch --match-head-commit "$head_oid"; then
              echo "#$pr: merged"
              merged_any=1
              merged_oid=$(gh pr view "$pr" -R "$REPO" --json mergeCommit -q .mergeCommit.oid) || merged_oid=""
              if ! echo "${merged_oid}" | grep -Eq '^[0-9a-f]{40}$'; then
                echo "#$pr: could not resolve the merge commit; not starting ci" >&2
                exit 1
              fi
              for workflow in ci.yml no-comments.yml; do
                workflow_started=""
                for _ in 1 2 3; do
                  gh workflow run "$workflow" -R "$REPO" --ref main || echo "#$pr: dispatch attempt failed; retrying"
                  sleep 15
                  main_now=$(gh api "repos/$REPO/commits/main" --jq .sha 2>/dev/null) || main_now=""
                  if [ -n "${main_now}" ] && [ "${main_now}" != "${merged_oid}" ]; then
                    now_count=$(gh run list -R "$REPO" -w "$workflow" -b main --commit "$main_now" --json databaseId -q 'length' 2>/dev/null) || now_count=""
                    if [ "${now_count:-0}" -ge 1 ] 2>/dev/null; then
                      echo "#$pr: main advanced to ${main_now}; its ${workflow} run feeds the release"
                      workflow_started=1
                      break
                    fi
                    echo "#$pr: main advanced to ${main_now} but has no ${workflow} run; retrying dispatch"
                  fi
                  count=$(gh run list -R "$REPO" -w "$workflow" -b main --commit "$merged_oid" --json databaseId -q 'length' 2>/dev/null) || count=""
                  if [ "${count:-0}" -ge 1 ] 2>/dev/null; then
                    echo "#$pr: ${workflow} dispatched on main (${merged_oid})"
                    workflow_started=1
                    break
                  fi
                  echo "#$pr: ${workflow} run not visible yet, retrying dispatch"
                done
                if [ -z "$workflow_started" ]; then
                  echo "#$pr: could not start ${workflow} on main after 3 dispatches" >&2
                  exit 1
                fi
              done
            else
              echo "#$pr: merge failed"
            fi
          done

          if [ "$merged_any" -eq 0 ]; then
            head_oid=$(gh api "repos/$REPO/commits/main" --jq .sha 2>/dev/null) || head_oid=""
            if ! echo "${head_oid}" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "could not resolve main head; skipping self-heal this pass" >&2
            else
              for workflow in ci.yml no-comments.yml; do
                run_count=$(gh run list -R "$REPO" -w "$workflow" -b main --commit "$head_oid" --json databaseId -q 'length') || run_count=""
                if [ -z "$run_count" ]; then
                  echo "could not list ${workflow} runs for main head; skipping self-heal this pass" >&2
                elif [ "$run_count" -eq 0 ]; then
                  echo "main head ${head_oid} has no ${workflow} run; dispatching"
                  gh workflow run "$workflow" -R "$REPO" --ref main \
                    || { sleep 5; gh workflow run "$workflow" -R "$REPO" --ref main; } \
                    || { echo "self-heal dispatch failed; next pass will retry" >&2; exit 1; }
                fi
              done
            fi
          fi
