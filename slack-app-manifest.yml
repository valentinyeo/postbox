display_information:
  name: Wazig
  description: Slack in the Wazig Messages desktop client
  background_color: "#1F2328"
oauth_config:
  redirect_urls:
    - http://localhost:53682/slack/oauth/callback
  pkce_enabled: true
  scopes:
    user:
      - channels:read
      - channels:history
      - groups:read
      - groups:history
      - im:read
      - im:history
      - mpim:read
      - mpim:history
      - users:read
      - chat:write
      - files:read
      - files:write
      - reactions:read
      - channels:write
      - groups:write
      - im:write
      - mpim:write
settings:
  socket_mode_enabled: true
  token_rotation_enabled: true
  event_subscriptions:
    user_events:
      - message.channels
      - message.groups
      - message.im
      - message.mpim
      - reaction_added
      - reaction_removed
  org_deploy_enabled: false
  is_hosted: false
