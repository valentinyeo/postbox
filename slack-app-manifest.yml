display_information:
  name: Messages
  description: Slack in the Wazig Messages desktop client
  background_color: "#1F2328"
features:
  bot_user:
    display_name: Messages
    always_online: false
oauth_config:
  user_token_scopes:
    - channels:history
    - channels:read
    - groups:history
    - groups:read
    - im:history
    - im:read
    - mpim:history
    - mpim:read
    - users:read
    - files:read
    - files:write
    - chat:write
settings:
  socket_mode:
    enabled: true
  event_subscriptions:
    user_events:
      - message.channels
      - message.groups
      - message.im
      - message.mpim
  org_deploy_enabled: false
  is_hosted: false
  token_management_enabled: false
